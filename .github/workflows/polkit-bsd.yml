name: polkit (BSD)

# security/polkit がどの OS で建つかを、polkit だけ建てて測る。
#
# NetworkManager を建てる run の副産物として見ていたが、それでは polkit の
# 手前で転んだのか polkit で転んだのか、polkit の後で転んだのかが分かるまで
# 数時間かかる。実際、最後の run は polkit を素通りして NM 本体の
# [213/842] まで行ってから落ちていて、polkit が通ったことはそこから逆算する
# しかなかった。polkit を名指しで建てれば、答は polkit の行に出る。
#
# 木の patch-src_polkitagent_polkitagenthelper-pam.c は SO_PEERCRED の半分
# しか持たず、ENODATA を持たない FreeBSD 系は polkitagenthelper-pam.c で
# 落ちる。合成版に差し替えるのが verify-polkit.sh で、そこまで含めて測る。
#
# VM は高い (boot だけで 8-12 分) ので push では回さない。手で押す。

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'どれを回すか'
        type: choice
        options: [all, freebsd, netbsd, openbsd, dragonfly, ghostbsd]
        default: all

# target も group に入れる。入れないと openbsd の run を dragonfly の run が
# 畳む — 別の箱を測る別の仕事なのに、同じ ref というだけで同じ仕事に見える。
concurrency:
  group: polkit-bsd-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: true

env:
  PKGS: ''
  TREE_PKGS: security/polkit
  TREE_PATCH: .github/ci/tree-patch-polkit.sh

jobs:
  freebsd:
    if: inputs.target == 'all' || inputs.target == 'freebsd'
    name: FreeBSD amd64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: ディスクを空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache/restore@v4
        with:
          path: .bsdcache
          key: polkit-freebsd-amd64-${{ github.run_id }}
          restore-keys: |
            polkit-freebsd-amd64-
            nm-freebsd-amd64-
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '14.4'
          envs: 'PKGS TREE_PKGS TREE_PATCH'
          run: sh .github/ci/build-on-bsd.sh
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .bsdcache
          key: polkit-freebsd-amd64-${{ github.run_id }}

  openbsd:
    if: inputs.target == 'all' || inputs.target == 'openbsd'
    name: OpenBSD amd64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: ディスクを空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache/restore@v4
        with:
          path: .bsdcache
          key: polkit-openbsd-amd64-${{ github.run_id }}
          restore-keys: |
            polkit-openbsd-amd64-
            nm-openbsd-amd64-
      - uses: vmactions/openbsd-vm@v1
        with:
          release: '7.9'
          envs: 'PKGS TREE_PKGS TREE_PATCH'
          run: sh .github/ci/build-on-bsd.sh
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .bsdcache
          key: polkit-openbsd-amd64-${{ github.run_id }}

  dragonfly:
    if: inputs.target == 'all' || inputs.target == 'dragonfly'
    name: DragonFly amd64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: ディスクを空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache/restore@v4
        with:
          path: .bsdcache
          key: polkit-dragonfly-amd64-${{ github.run_id }}
          restore-keys: |
            polkit-dragonfly-amd64-
            nm-dragonfly-amd64-
      - uses: vmactions/dragonflybsd-vm@v1
        with:
          release: '6.4.2'
          envs: 'PKGS TREE_PKGS TREE_PATCH'
          run: sh .github/ci/build-on-bsd.sh
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .bsdcache
          key: polkit-dragonfly-amd64-${{ github.run_id }}

  ghostbsd:
    if: inputs.target == 'all' || inputs.target == 'ghostbsd'
    name: GhostBSD
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: ディスクを空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache/restore@v4
        with:
          path: .bsdcache
          key: polkit-ghostbsd-${{ github.run_id }}
          restore-keys: |
            polkit-ghostbsd-
            nm-ghostbsd-
      - uses: vmactions/ghostbsd-vm@v1
        with:
          envs: 'PKGS TREE_PKGS TREE_PATCH'
          run: sh .github/ci/build-on-bsd.sh
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .bsdcache
          key: polkit-ghostbsd-${{ github.run_id }}

  # NetBSD だけ vmactions を使わない。自前の image を qemu で起こす方が、
  # 同じ道具で i386 まで回せる。KVM は runner に在り、amd64 も i386 も
  # 加速される (TCG になるのはホストと arch が違うゲストだけ)。
  netbsd:
    if: inputs.target == 'all' || inputs.target == 'netbsd'
    name: NetBSD amd64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: ディスクを空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache/restore@v4
        with:
          path: .bsdcache
          key: polkit-netbsd-amd64-${{ github.run_id }}
          restore-keys: |
            polkit-netbsd-amd64-
            nm-netbsd-amd64-
      - name: qemu を入れて KVM を通す
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils netcat-openbsd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo udevadm settle --timeout=10 || true
          [ -w /dev/kvm ] || sudo chmod 666 /dev/kvm 2>/dev/null || true
          if [ -w /dev/kvm ]; then
            echo "KVM あり"
          elif [ -e /dev/kvm ]; then
            echo "::warning::/dev/kvm は在るが書けない。TCG になり相当遅い"
          else
            echo "::warning::/dev/kvm が無い。TCG になり相当遅い"
          fi
      - name: 組んで確かめる
        run: sh .github/ci/run-in-qemu.sh amd64-11.0
        env:
          UPSTREAM_PKG: security/polkit
          VERIFY_SCRIPT: verify-polkit.sh
      - name: 転んだら console を出す
        if: failure()
        run: tail -80 .vm/amd64-11.0.console.log 2>/dev/null || true
      - if: always()
        uses: actions/cache/save@v4
        with:
          path: .bsdcache
          key: polkit-netbsd-amd64-${{ github.run_id }}

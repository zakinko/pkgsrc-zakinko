name: NetworkManager (BSD)

# NetworkManager を BSD で建てて、最初にどこで止まるかを採る。
#
# 段 0 である。「通す」ためではなく、「どこまで行くか」を知るために回す。
# 読んで得た事実 (platform backend が nm-linux-platform.c ひとつ、木の中に
# __FreeBSD__ も __NetBSD__ も一つも無い、netlink が 76 file) は、撃った
# 事実ではない。実際に建てるとどこで転ぶのかを見てから、次を決める。
#
# なぜ FreeBSD からか
# -------------------
# udev の穴は pkgsrc の devel/libudev-bsd が四つの BSD ぜんぶを覆っていて、
# NetBSD も含めて埋まっている (最初「FreeBSD だけ」と書いたのは誤り)。
# 残る FreeBSD の利点は、ports の net-mgmt/networkmanager-shim が
# 「NM の client 側を FreeBSD で compile するには何が要るか」を既に踏破して
# いること。あれは本体を建てず nm-enum-types.c だけを libnm.so.0 という名前に
# 固め、公開 header から #include <linux/...> を削って置く。どこが刺さるかの
# 地図として読める。
#
# VM は高い (boot だけで 8-12 分)。手で起動する。押すまで何もしない。

on:
  workflow_dispatch:
    inputs:
      pkgs:
        description: '何を建てるか'
        type: choice
        options: ['NetworkManager', 'libndp', 'libndp NetworkManager']
        default: 'NetworkManager'
      target:
        description: 'どれを回すか (VM は高いので既定は一つ)'
        type: choice
        options: [freebsd, netbsd, openbsd, dragonfly, ghostbsd, all]
        default: freebsd
      freebsd_release:
        description: 'FreeBSD の版'
        default: '14.4'

jobs:
  freebsd:
    if: inputs.target == 'all' || inputs.target == 'freebsd'
    name: FreeBSD amd64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      # actions/cache は job が転ぶと保存しない。段 0 は転ぶ前提なので、
      # restore と save を分けて save を if: always() で回す。そうしないと
      # 依存を毎回 perl から建て直して、転ぶ場所に着く前に時間を使い切る。
      - name: pkgsrc の作りかけを戻す
        uses: actions/cache/restore@v4
        with:
          path: .bsdcache
          key: nm-freebsd-amd64-${{ github.run_id }}
          restore-keys: nm-freebsd-amd64-

      - name: 組んで確かめる
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ inputs.freebsd_release || '14.4' }}
          envs: 'PKGS CARRY TREE_PATCH'
          run: sh .github/ci/build-on-bsd.sh
        env:
          PKGS: ${{ inputs.pkgs || 'NetworkManager' }}
          CARRY: libndp
          TREE_PATCH: .github/ci/tree-patch-docbook.sh

      - name: pkgsrc の作りかけを持ち越す
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bsdcache
          key: nm-freebsd-amd64-${{ github.run_id }}

  openbsd:
    if: inputs.target == 'all' || inputs.target == 'openbsd'
    name: OpenBSD amd64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: ディスクを空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - name: pkgsrc の作りかけを戻す
        uses: actions/cache/restore@v4
        with:
          path: .bsdcache
          key: nm-openbsd-amd64-${{ github.run_id }}
          restore-keys: nm-openbsd-amd64-
      - name: 組んで確かめる
        uses: vmactions/openbsd-vm@v1
        with:
          release: '7.9'
          envs: 'PKGS CARRY TREE_PATCH'
          run: sh .github/ci/build-on-bsd.sh
        env:
          PKGS: ${{ inputs.pkgs || 'NetworkManager' }}
          CARRY: libndp
          TREE_PATCH: .github/ci/tree-patch-docbook.sh
      - name: pkgsrc の作りかけを持ち越す
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bsdcache
          key: nm-openbsd-amd64-${{ github.run_id }}

  dragonfly:
    if: inputs.target == 'all' || inputs.target == 'dragonfly'
    name: DragonFly amd64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: ディスクを空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - name: pkgsrc の作りかけを戻す
        uses: actions/cache/restore@v4
        with:
          path: .bsdcache
          key: nm-dragonfly-amd64-${{ github.run_id }}
          restore-keys: nm-dragonfly-amd64-
      # release は版を書き切る。この action には「先頭だけ」の仕組みが無く、
      # "6" は 6.conf を探して転ぶ (mule-otherbsd.yml で踏んである)。
      - name: 組んで確かめる
        uses: vmactions/dragonflybsd-vm@v1
        with:
          release: '6.4.2'
          envs: 'PKGS CARRY TREE_PATCH'
          run: sh .github/ci/build-on-bsd.sh
        env:
          PKGS: ${{ inputs.pkgs || 'NetworkManager' }}
          CARRY: libndp
          TREE_PATCH: .github/ci/tree-patch-docbook.sh
      - name: pkgsrc の作りかけを持ち越す
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bsdcache
          key: nm-dragonfly-amd64-${{ github.run_id }}

  # GhostBSD は FreeBSD 派生で kernel が同じなので、pkgsrc から見た OPSYS も
  # FreeBSD になる。差は userland と package の作りだけのはずで、そこが
  # 同じに見えるかを確かめる。ONLY_FOR_PLATFORM に行は要らない。
  ghostbsd:
    if: inputs.target == 'all' || inputs.target == 'ghostbsd'
    name: GhostBSD
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: ディスクを空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - name: pkgsrc の作りかけを戻す
        uses: actions/cache/restore@v4
        with:
          path: .bsdcache
          key: nm-ghostbsd-${{ github.run_id }}
          restore-keys: nm-ghostbsd-
      - name: 組んで確かめる
        uses: vmactions/ghostbsd-vm@v1
        with:
          envs: 'PKGS CARRY TREE_PATCH'
          run: sh .github/ci/build-on-bsd.sh
        env:
          PKGS: ${{ inputs.pkgs || 'NetworkManager' }}
          CARRY: libndp
          TREE_PATCH: .github/ci/tree-patch-docbook.sh
      - name: pkgsrc の作りかけを持ち越す
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bsdcache
          key: nm-ghostbsd-${{ github.run_id }}

  # NetBSD だけ vmactions を使わない。vmactions に NetBSD/i386 の image が
  # 無いため、この repo は自前の image を持っている。amd64 だけなら
  # vmactions/netbsd-vm で足りる (conf/11.0.conf があり default も 11.0)。
  # ここでは同じ道具で i386 まで回せるほうを採る。
  #
  # 速さの話ではない。/dev/kvm は GitHub の runner に在り、amd64 も i386 も
  # KVM で走る。TCG になるのはホストと arch が違うゲストだけである。
  # (この段に最初「vmactions は KVM が使えず TCG になる」と書いたが誤りで、
  #  run-in-qemu.sh の同じ誤りごと 2026-09-17 に直した。)
  #
  # UPSTREAM_PKG は空白区切りで複数を運べる。NetworkManager は
  # zakinko/libndp を buildlink で引くので、両方を渡す。
  netbsd:
    if: inputs.target == 'all' || inputs.target == 'netbsd'
    name: NetBSD amd64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: ディスクを空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - name: pkgsrc の作りかけを戻す
        uses: actions/cache/restore@v4
        with:
          path: .bsdcache
          key: nm-netbsd-amd64-${{ github.run_id }}
          restore-keys: nm-netbsd-amd64-
      - name: 組んで確かめる
        run: sh .github/ci/run-in-qemu.sh amd64-11.0
        env:
          UPSTREAM_PKG: 'zakinko/libndp zakinko/NetworkManager'
          VERIFY_SCRIPT: verify-NetworkManager.sh
      - name: 転んだら console を出す
        if: failure()
        run: tail -80 .vm/amd64-11.0.console.log 2>/dev/null || true
      - name: pkgsrc の作りかけを持ち越す
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bsdcache
          key: nm-netbsd-amd64-${{ github.run_id }}

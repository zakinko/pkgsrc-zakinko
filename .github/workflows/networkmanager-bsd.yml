name: NetworkManager (BSD)

# NetworkManager を BSD で建てて、最初にどこで止まるかを採る。
#
# 段 0 である。「通す」ためではなく、「どこまで行くか」を知るために回す。
# 読んで得た事実 (platform backend が nm-linux-platform.c ひとつ、木の中に
# __FreeBSD__ も __NetBSD__ も一つも無い、netlink が 76 file) は、撃った
# 事実ではない。実際に建てるとどこで転ぶのかを見てから、次を決める。
#
# なぜ FreeBSD からか
# -------------------
# udev の穴は pkgsrc の devel/libudev-bsd が四つの BSD ぜんぶを覆っていて、
# NetBSD も含めて埋まっている (最初「FreeBSD だけ」と書いたのは誤り)。
# 残る FreeBSD の利点は、ports の net-mgmt/networkmanager-shim が
# 「NM の client 側を FreeBSD で compile するには何が要るか」を既に踏破して
# いること。あれは本体を建てず nm-enum-types.c だけを libnm.so.0 という名前に
# 固め、公開 header から #include <linux/...> を削って置く。どこが刺さるかの
# 地図として読める。
#
# VM は高い (boot だけで 8-12 分)。手で起動する。押すまで何もしない。

on:
  workflow_dispatch:
    inputs:
      pkgs:
        description: '何を建てるか'
        type: choice
        options: ['NetworkManager', 'libndp', 'libndp NetworkManager']
        default: 'NetworkManager'
      freebsd_release:
        description: 'FreeBSD の版'
        default: '14.4'

jobs:
  freebsd:
    name: FreeBSD amd64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      # actions/cache は job が転ぶと保存しない。段 0 は転ぶ前提なので、
      # restore と save を分けて save を if: always() で回す。そうしないと
      # 依存を毎回 perl から建て直して、転ぶ場所に着く前に時間を使い切る。
      - name: pkgsrc の作りかけを戻す
        uses: actions/cache/restore@v4
        with:
          path: .bsdcache
          key: nm-freebsd-amd64-${{ github.run_id }}
          restore-keys: nm-freebsd-amd64-

      - name: 組んで確かめる
        uses: vmactions/freebsd-vm@v1
        with:
          release: ${{ inputs.freebsd_release || '14.4' }}
          envs: 'PKGS CARRY TREE_PATCH'
          run: sh .github/ci/build-on-bsd.sh
        env:
          PKGS: ${{ inputs.pkgs || 'NetworkManager' }}
          CARRY: libndp
          TREE_PATCH: .github/ci/tree-patch-docbook.sh

      - name: pkgsrc の作りかけを持ち越す
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .bsdcache
          key: nm-freebsd-amd64-${{ github.run_id }}

name: mule (other BSD)

# mule のパッケージが NetBSD 以外の BSD でも通るかを見る。
#
# NetBSD 側 (mule.yml) と違い、ここは pkgsrc を bootstrap するところから
# 始まる。公式のバイナリパッケージも無いので依存は全部その場で組む。
# 「パッケージが通るか」だけでなく「pkgsrc が載るか」も込みで見たいので、
# そこは省かない。
#
# amd64 の VM は vmactions のものを借りる。NetBSD は anita で自分で
# イメージを作っているが (netbsd-ci-images)、この三者は既製のものがある
# ので作らない。uses: に式が書けないので、同じ形の job が並ぶ。中身は
# 一本の build-on-bsd.sh に寄せてある。
#
# release は版を書き切る。先頭だけでも一番新しいものが選ばれる作りだが、
# DragonFly の action にはその仕組みが無く "6" は 6.conf を探して転ぶ。
# どのみち、ツリーの下が黙って動かないほうがよい。
#
# i386 は借りるあてが無い。vmactions も cross-platform-actions も amd64 と
# aarch64 と riscv64 しか作っていない。FreeBSD だけは公式に i386 の qcow2
# を配っているので、そこだけ自前で QEMU を回す (run-freebsd-i386.sh)。
# OpenBSD には公式のイメージが無く、i386 を回すには自動インストールから
# 作ることになる。DragonFly は 4.0 (2014) で i386 を捨てているので無い。
# ILP32 のこのコードにとって i386 は本籍地なので、一つでも足しておく。
#
# 構成は端末のみ。X11 と canna と wnn4 は、まず端末版が通ってからにする。
# workflow_dispatch から options を渡せば試せる。
#
# 現状の見込み (2026-08 時点、ソースを読んだ限り。CI はこれを裏取りする
# ためのもの):
#
#   FreeBSD    patch-configure が腕を足したので configure は通る。ただし
#              上流の s/freebsd.h は a.out 時代のままで、unexsunos4.o と
#              pre-crt0.o を使い、PENDING_OUTPUT_COUNT が FILE の中身を
#              直接触る。FreeBSD の stdio はもう不透明なので、ここは
#              コンパイルの時点で転けるはず。
#   OpenBSD    configure に腕が無く、s/openbsd.h も無い。OpenBSD の分岐が
#              このツリーより後なので当然で、unported で止まる。
#   DragonFly  patch-ca の s/dragonfly.h に初めて実際に届く。joerg が
#              2006 年に「DragonFly が無いので未確認」と書いたまま 20 年
#              通っているもので、当たりが付くとすればここ。
#   MidnightBSD FreeBSD 6 系からのフォークで、pkgsrc にも MidnightBSD.mk が
#              ある。OPSYS が違うだけで中身は FreeBSD に近いので、FreeBSD
#              側の当て物がどこまで効くかが見える。
#
# つまり当面は赤い。どこで止まるかを毎回同じ形で読めるようにするための
# 足場で、緑にしていくのはこれから。
#
# 実際に回してみると、DragonFly は mule の configure まで届いていなかった。
# 依存の devel/libuuid (util-linux) が組めず、lang/python313 から gtexinfo
# までが止まる。mule 側ではなく pkgsrc 側の話なので、直しは
# zakinko/libuuid に置いてある。

on:
  push:
    paths:
      - 'mule/**'
      - '.github/workflows/mule-otherbsd.yml'
      - '.github/ci/**'
      - 'libuuid/**'
  pull_request:
    paths:
      - 'mule/**'
      - '.github/ci/**'
      - 'libuuid/**'
  workflow_dispatch:
    inputs:
      options:
        description: 'PKG_OPTIONS.mule (既定は端末のみ)'
        required: false
        default: '-canna -wnn4 -x11'

env:
  OPTIONS: ${{ inputs.options || '-canna -wnn4 -x11' }}

jobs:
  freebsd:
    name: FreeBSD amd64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      # ftp.m17n.org は消滅していて、残っているのは KAIST の書庫だけ。
      # 落ちていても CI が転ばないよう、取れたものは残す。
      - name: distfile のキャッシュ
        uses: actions/cache@v4
        with:
          path: distfiles
          key: mule-2.3-tarball

      - name: distfile を取る
        run: sh .github/ci/fetch-distfile.sh

      # bootstrap の binary kit と、作ったバイナリパッケージと配布物。
      # 毎回 perl から組み直すと 1 時間近く待つことになる。
      # key を run_id で毎回変えて restore-keys で拾うのは、キャッシュが
      # 上書きできないため。同じ key では二度目以降が保存されない。
      - name: pkgsrc の作りかけを持ち越す
        uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgsrc-freebsd-amd64-${{ github.run_id }}
          restore-keys: pkgsrc-freebsd-amd64-

      - name: 組んで確かめる
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.4'
          envs: 'OPTIONS'
          run: sh .github/ci/build-on-bsd.sh "$OPTIONS"

  openbsd:
    name: OpenBSD amd64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: distfile のキャッシュ
        uses: actions/cache@v4
        with:
          path: distfiles
          key: mule-2.3-tarball

      - name: distfile を取る
        run: sh .github/ci/fetch-distfile.sh

      - name: pkgsrc の作りかけを持ち越す
        uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgsrc-openbsd-amd64-${{ github.run_id }}
          restore-keys: pkgsrc-openbsd-amd64-

      - name: 組んで確かめる
        uses: vmactions/openbsd-vm@v1
        with:
          release: '7.9'
          envs: 'OPTIONS'
          run: sh .github/ci/build-on-bsd.sh "$OPTIONS"

  dragonfly:
    name: DragonFly amd64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: distfile のキャッシュ
        uses: actions/cache@v4
        with:
          path: distfiles
          key: mule-2.3-tarball

      - name: distfile を取る
        run: sh .github/ci/fetch-distfile.sh

      - name: pkgsrc の作りかけを持ち越す
        uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgsrc-dragonfly-amd64-${{ github.run_id }}
          restore-keys: pkgsrc-dragonfly-amd64-

      - name: 組んで確かめる
        uses: vmactions/dragonflybsd-vm@v1
        with:
          release: '6.4.2'
          envs: 'OPTIONS'
          run: sh .github/ci/build-on-bsd.sh "$OPTIONS"

  midnightbsd:
    name: MidnightBSD amd64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: distfile のキャッシュ
        uses: actions/cache@v4
        with:
          path: distfiles
          key: mule-2.3-tarball

      - name: distfile を取る
        run: sh .github/ci/fetch-distfile.sh

      - name: pkgsrc の作りかけを持ち越す
        uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgsrc-midnightbsd-amd64-${{ github.run_id }}
          restore-keys: pkgsrc-midnightbsd-amd64-

      - name: 組んで確かめる
        uses: vmactions/midnightbsd-vm@v1
        with:
          release: '4.0.7'
          envs: 'OPTIONS'
          run: sh .github/ci/build-on-bsd.sh "$OPTIONS"

  freebsd-i386:
    name: FreeBSD i386
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: qemu を入れて KVM を通す
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils \
            netcat-openbsd xz-utils
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          [ -w /dev/kvm ] && echo "KVM あり" || echo "::warning::KVM 無し。相当遅い"

      - name: distfile のキャッシュ
        uses: actions/cache@v4
        with:
          path: distfiles
          key: mule-2.3-tarball

      - name: distfile を取る
        run: sh .github/ci/fetch-distfile.sh

      - name: pkgsrc の作りかけを持ち越す
        uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgsrc-freebsd-i386-${{ github.run_id }}
          restore-keys: pkgsrc-freebsd-i386-

      - name: 組んで確かめる
        run: sh .github/ci/run-freebsd-i386.sh "$OPTIONS"

      # このイメージはシリアルに何も出さないので、コンソールログは空の
      # ままになる。代わりに host の HTTP ログを出す。ゲストが /s を取りに
      # 来ていれば打鍵は届いており、来ていなければ届いていない。
      - name: 転けたら鍵入れの跡を出す
        if: failure()
        run: cat .vm-freebsd-i386/httpd.log 2>/dev/null || true

name: mule (other BSD)

# mule のパッケージが NetBSD 以外の BSD でも通るかを見る。
#
# NetBSD 側 (mule.yml) と違い、ここは pkgsrc を bootstrap するところから
# 始まる。公式のバイナリパッケージも無いので依存は全部その場で組む。
# 「パッケージが通るか」だけでなく「pkgsrc が載るか」も込みで見たいので、
# そこは省かない。
#
# VM は vmactions のものを借りる。NetBSD は anita で自分でイメージを
# 作っているが (netbsd-ci-images)、この三者は既製のものがあるので作らない。
# uses: に式が書けないので、同じ形の job が三つ並ぶ。中身は一本の
# build-on-bsd.sh に寄せてある。
#
# release は版を書き切る。先頭だけでも一番新しいものが選ばれる作りだが、
# DragonFly の action にはその仕組みが無く "6" は 6.conf を探して転ぶ。
# どのみち、ツリーの下が黙って動かないほうがよい。
#
# 構成は端末のみ。X11 と canna と wnn4 は、まず端末版が通ってからにする。
# workflow_dispatch から options を渡せば試せる。
#
# 現状の見込み (2026-08 時点、ソースを読んだ限り。CI はこれを裏取りする
# ためのもの):
#
#   FreeBSD    patch-configure が腕を足したので configure は通る。ただし
#              上流の s/freebsd.h は a.out 時代のままで、unexsunos4.o と
#              pre-crt0.o を使い、PENDING_OUTPUT_COUNT が FILE の中身を
#              直接触る。FreeBSD の stdio はもう不透明なので、ここは
#              コンパイルの時点で転けるはず。
#   OpenBSD    configure に腕が無く、s/openbsd.h も無い。OpenBSD の分岐が
#              このツリーより後なので当然で、unported で止まる。
#   DragonFly  patch-ca の s/dragonfly.h に初めて実際に届く。joerg が
#              2006 年に「DragonFly が無いので未確認」と書いたまま 20 年
#              通っているもので、当たりが付くとすればここ。
#
# つまり当面は赤い。どこで止まるかを毎回同じ形で読めるようにするための
# 足場で、緑にしていくのはこれから。

on:
  push:
    paths:
      - 'mule/**'
      - '.github/workflows/mule-otherbsd.yml'
      - '.github/ci/**'
  pull_request:
    paths:
      - 'mule/**'
      - '.github/ci/**'
  workflow_dispatch:
    inputs:
      options:
        description: 'PKG_OPTIONS.mule (既定は端末のみ)'
        required: false
        default: '-canna -wnn4 -x11'

env:
  OPTIONS: ${{ inputs.options || '-canna -wnn4 -x11' }}

jobs:
  freebsd:
    name: FreeBSD amd64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      # ftp.m17n.org は消滅していて、残っているのは KAIST の書庫だけ。
      # 落ちていても CI が転ばないよう、取れたものは残す。
      - name: distfile のキャッシュ
        uses: actions/cache@v4
        with:
          path: distfiles
          key: mule-2.3-tarball

      - name: distfile を取る
        run: sh .github/ci/fetch-distfile.sh

      # bootstrap の binary kit と、作ったバイナリパッケージと配布物。
      # 毎回 perl から組み直すと 1 時間近く待つことになる。
      # key を run_id で毎回変えて restore-keys で拾うのは、キャッシュが
      # 上書きできないため。同じ key では二度目以降が保存されない。
      - name: pkgsrc の作りかけを持ち越す
        uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgsrc-freebsd-${{ github.run_id }}
          restore-keys: pkgsrc-freebsd-

      - name: 組んで確かめる
        uses: vmactions/freebsd-vm@v1
        with:
          release: '14.4'
          envs: 'OPTIONS'
          run: sh .github/ci/build-on-bsd.sh "$OPTIONS"

  openbsd:
    name: OpenBSD amd64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: distfile のキャッシュ
        uses: actions/cache@v4
        with:
          path: distfiles
          key: mule-2.3-tarball

      - name: distfile を取る
        run: sh .github/ci/fetch-distfile.sh

      - name: pkgsrc の作りかけを持ち越す
        uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgsrc-openbsd-${{ github.run_id }}
          restore-keys: pkgsrc-openbsd-

      - name: 組んで確かめる
        uses: vmactions/openbsd-vm@v1
        with:
          release: '7.9'
          envs: 'OPTIONS'
          run: sh .github/ci/build-on-bsd.sh "$OPTIONS"

  dragonfly:
    name: DragonFly amd64
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: distfile のキャッシュ
        uses: actions/cache@v4
        with:
          path: distfiles
          key: mule-2.3-tarball

      - name: distfile を取る
        run: sh .github/ci/fetch-distfile.sh

      - name: pkgsrc の作りかけを持ち越す
        uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgsrc-dragonfly-${{ github.run_id }}
          restore-keys: pkgsrc-dragonfly-

      - name: 組んで確かめる
        uses: vmactions/dragonflybsd-vm@v1
        with:
          release: '6.4.2'
          envs: 'OPTIONS'
          run: sh .github/ci/build-on-bsd.sh "$OPTIONS"


name: n-acd の継ぎ目 (BSD)

# NetworkManager が同梱する n-acd を BSD で動かすための継ぎ目だけを建てて測る。
#
# 本体を待たない理由。NetworkManager は BSD では継ぎ目よりずっと手前 —
# platform backend が nm-linux-platform.c ひとつしか無い所 — で止まるので、
# 本体の build が緑になるのを待っていると継ぎ目は一生測られない。継ぎ目は
# 継ぎ目として測れるし、そのほうが落ちたときに何が壊れたか判る。
#
# 測る対象は package が配る当て物そのもので、patch から + を剥いで file に
# 戻している。当て物を直せばここが測る物も一緒に変わるので、写しが古くなって
# 緑のまま意味を失うことがない。
#
# 建つだけで終わらせない。vmactions の VM は root で走り、本物の interface を
# 持っているので、n-acd を丸ごと建てて実際に ARP を撃つ。default route の先を
# 探らせて USED が返れば、送信・filter・framing・timer・state machine が一本に
# 繋がっている。撃つのは spa が 0 の ARP request で、DHCP client が起動のたびに
# やっているのと同じものである。
#
# そのために配布物が要る。runner の側で一度だけ取って cache し、VM へは
# workspace ごと渡る。

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'どれを回すか (VM は boot だけで 8-12 分かかる)'
        type: choice
        options: [all, freebsd, netbsd, netbsd-i386, openbsd, dragonfly, ghostbsd]
        default: all
  push:
    # 継ぎ目と、それを測る物が動いたときだけ。README の誤字で VM を五つ
    # 起こさない。job の if: では runner が起動した分を払うので、workflow
    # の側で切る。
    paths:
      - 'NetworkManager/patches/patch-src_n-acd_src_n-acd-os*'
      - '.github/ci/n-acd/**'
      - '.github/ci/c-stdaux/**'
      - '.github/workflows/n-acd-seam.yml'

concurrency:
  group: n-acd-seam-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freebsd:
    if: inputs.target == null || inputs.target == 'all' || inputs.target == 'freebsd'
    name: FreeBSD amd64
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # VM の中から取りにいくと五つ分の転送になる。runner で一度取って cache
      # する。MASTER_SITES は package の Makefile と同じ所。
      - name: 配布物 (cache)
        id: dist
        uses: actions/cache@v4
        with:
          path: NetworkManager.tar.bz2
          key: nm-dist-1.50.0
      - name: 配布物を取る
        if: steps.dist.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o NetworkManager.tar.bz2 \
            https://gitlab.freedesktop.org/NetworkManager/NetworkManager/-/archive/1.50.0/NetworkManager-1.50.0.tar.bz2
          ls -l NetworkManager.tar.bz2
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '14.4'
          run: sh .github/ci/n-acd/verify-seam.sh

  netbsd:
    if: inputs.target == null || inputs.target == 'all' || inputs.target == 'netbsd'
    name: NetBSD amd64
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # VM の中から取りにいくと五つ分の転送になる。runner で一度取って cache
      # する。MASTER_SITES は package の Makefile と同じ所。
      - name: 配布物 (cache)
        id: dist
        uses: actions/cache@v4
        with:
          path: NetworkManager.tar.bz2
          key: nm-dist-1.50.0
      - name: 配布物を取る
        if: steps.dist.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o NetworkManager.tar.bz2 \
            https://gitlab.freedesktop.org/NetworkManager/NetworkManager/-/archive/1.50.0/NetworkManager-1.50.0.tar.bz2
          ls -l NetworkManager.tar.bz2
      - uses: vmactions/netbsd-vm@v1
        with:
          release: '11.0'
          run: sh .github/ci/n-acd/verify-seam.sh

  openbsd:
    if: inputs.target == null || inputs.target == 'all' || inputs.target == 'openbsd'
    name: OpenBSD amd64
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # VM の中から取りにいくと五つ分の転送になる。runner で一度取って cache
      # する。MASTER_SITES は package の Makefile と同じ所。
      - name: 配布物 (cache)
        id: dist
        uses: actions/cache@v4
        with:
          path: NetworkManager.tar.bz2
          key: nm-dist-1.50.0
      - name: 配布物を取る
        if: steps.dist.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o NetworkManager.tar.bz2 \
            https://gitlab.freedesktop.org/NetworkManager/NetworkManager/-/archive/1.50.0/NetworkManager-1.50.0.tar.bz2
          ls -l NetworkManager.tar.bz2
      - uses: vmactions/openbsd-vm@v1
        with:
          release: '7.9'
          run: sh .github/ci/n-acd/verify-seam.sh

  dragonfly:
    if: inputs.target == null || inputs.target == 'all' || inputs.target == 'dragonfly'
    name: DragonFly amd64
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # VM の中から取りにいくと五つ分の転送になる。runner で一度取って cache
      # する。MASTER_SITES は package の Makefile と同じ所。
      - name: 配布物 (cache)
        id: dist
        uses: actions/cache@v4
        with:
          path: NetworkManager.tar.bz2
          key: nm-dist-1.50.0
      - name: 配布物を取る
        if: steps.dist.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o NetworkManager.tar.bz2 \
            https://gitlab.freedesktop.org/NetworkManager/NetworkManager/-/archive/1.50.0/NetworkManager-1.50.0.tar.bz2
          ls -l NetworkManager.tar.bz2
      - uses: vmactions/dragonflybsd-vm@v1
        with:
          release: '6.4.2'
          run: sh .github/ci/n-acd/verify-seam.sh

  ghostbsd:
    if: inputs.target == null || inputs.target == 'all' || inputs.target == 'ghostbsd'
    name: GhostBSD amd64
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # VM の中から取りにいくと五つ分の転送になる。runner で一度取って cache
      # する。MASTER_SITES は package の Makefile と同じ所。
      - name: 配布物 (cache)
        id: dist
        uses: actions/cache@v4
        with:
          path: NetworkManager.tar.bz2
          key: nm-dist-1.50.0
      - name: 配布物を取る
        if: steps.dist.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o NetworkManager.tar.bz2 \
            https://gitlab.freedesktop.org/NetworkManager/NetworkManager/-/archive/1.50.0/NetworkManager-1.50.0.tar.bz2
          ls -l NetworkManager.tar.bz2
      - uses: vmactions/ghostbsd-vm@v1
        with:
          run: sh .github/ci/n-acd/verify-seam.sh

  netbsd-i386:
    if: inputs.target == null || inputs.target == 'all' || inputs.target == 'netbsd-i386'
    name: NetBSD i386
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # vmactions に NetBSD/i386 の image は無い (builder の conf にも
      # release の asset にも一つも無い) ので、ここだけ自前の image を
      # qemu で起こす。i386 のゲストも x86_64 のホストなら KVM で走る。
      #
      # 32 bit を測る値打ちはある。BPF の framing は bpf_hdr の大きさと
      # BPF_WORDALIGN の効き方で位置が決まるので、語長が変われば変わりうる。
      # NetBSD 10.1/i386 の実機では通っているが、実機一台は CI ではない。
      - name: qemu を入れて KVM を通す
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils netcat-openbsd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo udevadm settle --timeout=10 || true
          [ -w /dev/kvm ] || sudo chmod 666 /dev/kvm 2>/dev/null || true
          if [ -w /dev/kvm ]; then
            echo "KVM あり"
          elif [ -e /dev/kvm ]; then
            echo "::warning::/dev/kvm は在るが書けない (起動時に再判定される)"
          else
            echo "::warning::/dev/kvm が無い (起動時に再判定される)"
          fi

      - name: 組んで確かめる
        run: sh .github/ci/run-in-qemu.sh i386-11.0
        env:
          UPSTREAM_PKG: 'zakinko/NetworkManager'
          VERIFY_SCRIPT: n-acd/verify-seam.sh
          DIST_URL: 'https://gitlab.freedesktop.org/NetworkManager/NetworkManager/-/archive/1.50.0/NetworkManager-1.50.0.tar.bz2'

      - name: 転んだら console を出す
        if: failure()
        run: tail -80 .vm/i386-11.0.console.log 2>/dev/null || true

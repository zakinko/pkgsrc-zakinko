name: arm runner に KVM が在るか

# 使い捨ての測定。aarch64 の guest が TCG になっていたのは host が x86_64
# だからで、arm64 の runner なら KVM が効くはず、という筋を確かめる。
# 「在るはず」で matrix を書き換えると、効いていないのに速くなった顔で
# 通ることがあるので、先に host 側を見る。

# 起こし直し (2026-09-23 19:35Z)。RISE の GitHub App は
# workflow_job.queued の webhook で job を拾う作りなので、App を入れる前に
# queue へ入った job は向こうから見えていない可能性がある。29 分 queued の
# まま動かなかったので、App 導入後に新しく webhook を飛ばす。
#
# workflow_dispatch は既定 branch に在る workflow しか呼べないので、
# この枝の push で起こす。自分の file だけを見るので他の作業では走らない。
on:
  push:
    branches: [thttpd]
    paths: ['.github/workflows/probe-arm-runner.yml']
  workflow_dispatch:

concurrency:
  group: probe-arm-${{ github.run_id }}

jobs:
  probe:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    # 存在しない label は「永久に queued」という、混雑と同じ顔で出る。
    # 短く切って、落ちたこと自体を「その label は無い」の観測にする。
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # riscv は在るかどうかから測る。runner-images の release tag にも
        # issue にも見当たらないが、一つの観測で「無い」とは書かない。
        # label が存在しなければ job は runner 待ちのまま進まないので、
        # continue-on-error と短い timeout で切って、それ自体を答にする。
        runner: [ubuntu-24.04-arm, ubuntu-24.04, ubuntu-24.04-riscv]
    steps:
      - name: host を見る
        run: |
          set -x
          uname -m
          ls -l /dev/kvm || echo "!! /dev/kvm が無い"
          grep -c . /proc/cpuinfo >/dev/null && nproc
          free -g | head -2
          df -h / | tail -1
      - name: qemu を入れて accel を訊く
        run: |
          set -x
          sudo apt-get update -qq
          # host と同じ arch の qemu を必ず入れる。KVM が効くのは host と
          # 同じ arch の guest だけなので、そこを入れずに -accel help を
          # 打っても tcg しか出ない。一度これで測り損ねた: riscv の箱で
          # /dev/kvm は在ったのに、入れたのが aarch64 と x86 の qemu だけ
          # だったため「tcg のみ」と読める log を作ってしまった。
          # riscv64 の qemu は Debian/Ubuntu では qemu-system-misc に入る。
          sudo apt-get install -y -qq qemu-system-arm qemu-system-x86 \
            qemu-system-misc >/dev/null || true
          echo "=== host と同じ arch の qemu"
          case "$(uname -m)" in
          x86_64)  self=qemu-system-x86_64 ;;
          aarch64) self=qemu-system-aarch64 ;;
          riscv64) self=qemu-system-riscv64 ;;
          *)       self= ;;
          esac
          if [ -n "$self" ] && command -v "$self" > /dev/null; then
            "$self" --version | head -1
            # これが本命。/dev/kvm が在っても binary が kvm を持たなければ
            # 使えず、binary が挙げても device が無ければ使えない。両方見る。
            "$self" -accel help
            echo "--- 素のまま kvm で起動できるか"
            "$self" -machine accel=kvm -nographic -m 128 \
              -kernel /dev/null -no-reboot 2>&1 | head -3 || true
            # device が在っても group から外れていれば Permission denied に
            # なる。RISE の riscv では /dev/kvm が root:sgx で、runner の
            # user がその group に居ない。vmactions が x86 の runner で
            # やっているのと同じ chmod で通るかを見る。通るなら「KVM が
            # 使えない箱」ではなく「一手要る箱」。
            if [ -e /dev/kvm ]; then
              echo "--- chmod 666 /dev/kvm のあと"
              id
              sudo chmod 666 /dev/kvm && ls -l /dev/kvm
              "$self" -machine accel=kvm -nographic -m 128 \
                -kernel /dev/null -no-reboot 2>&1 | head -3 || true
            fi
          else
            echo "!! $self が入らなかった"
          fi
          echo "=== よその arch (KVM が出ないのが正しい)"
          for q in qemu-system-aarch64 qemu-system-x86_64 qemu-system-riscv64; do
            command -v "$q" > /dev/null || continue
            [ "$q" = "$self" ] && continue
            echo "--- $q"
            "$q" -accel help
          done

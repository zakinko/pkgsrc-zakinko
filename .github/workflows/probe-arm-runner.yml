name: arm runner に KVM が在るか

# 使い捨ての測定。aarch64 の guest が TCG になっていたのは host が x86_64
# だからで、arm64 の runner なら KVM が効くはず、という筋を確かめる。
# 「在るはず」で matrix を書き換えると、効いていないのに速くなった顔で
# 通ることがあるので、先に host 側を見る。

# 起こし直し (2026-09-23 19:35Z)。RISE の GitHub App は
# workflow_job.queued の webhook で job を拾う作りなので、App を入れる前に
# queue へ入った job は向こうから見えていない可能性がある。29 分 queued の
# まま動かなかったので、App 導入後に新しく webhook を飛ばす。
#
# workflow_dispatch は既定 branch に在る workflow しか呼べないので、
# この枝の push で起こす。自分の file だけを見るので他の作業では走らない。
on:
  push:
    branches: [thttpd]
    paths: ['.github/workflows/probe-arm-runner.yml']
  workflow_dispatch:

concurrency:
  group: probe-arm-${{ github.run_id }}

jobs:
  probe:
    name: ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    # 存在しない label は「永久に queued」という、混雑と同じ顔で出る。
    # 短く切って、落ちたこと自体を「その label は無い」の観測にする。
    timeout-minutes: 10
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        # riscv は在るかどうかから測る。runner-images の release tag にも
        # issue にも見当たらないが、一つの観測で「無い」とは書かない。
        # label が存在しなければ job は runner 待ちのまま進まないので、
        # continue-on-error と短い timeout で切って、それ自体を答にする。
        runner: [ubuntu-24.04-arm, ubuntu-24.04, ubuntu-24.04-riscv]
    steps:
      - name: host を見る
        run: |
          set -x
          uname -m
          ls -l /dev/kvm || echo "!! /dev/kvm が無い"
          grep -c . /proc/cpuinfo >/dev/null && nproc
          free -g | head -2
          df -h / | tail -1
      - name: qemu を入れて accel を訊く
        run: |
          set -x
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-aarch64 qemu-system-x86 >/dev/null
          qemu-system-aarch64 --version | head -1
          # 名前ではなく、その binary が本当に kvm を持っているかを訊く
          qemu-system-aarch64 -accel help
          echo "--- x86_64 側"
          qemu-system-x86_64 -accel help

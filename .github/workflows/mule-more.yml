name: mule (more platforms)

# vmactions が用意しているもののうち、pkgsrc が相手にしている OS を残らず
# 並べる。既に mule-otherbsd.yml と mule-illumos.yml に居るものは除く。
#
#   GhostBSD   FreeBSD 派生。kernel は同じなので OPSYS も FreeBSD になる。
#              FreeBSD 本体との差は userland と package の作りだけのはずで、
#              そこが pkgsrc から見て同じに見えるかを確かめる。
#   Haiku      pkgsrc に Haiku.mk がある。/usr が無い OS なので、prefix も
#              ツリーも /boot/home の下へ寄せる (build-on-bsd.sh が OS を見て
#              決める)。BeOS の子孫でここまで来られるかは見物。
#   Solaris    illumos ではなく本家。SunOS.mk の本来の相手。
#   Tribblix   illumos 系。zap という独自の package 管理を持つ。
#   openEuler  Linux。glibc も gcc も新しい側で、Debian 系や EL 系と違う
#              取り合わせになる。
#
# ここも中身は同じ build-on-bsd.sh を呼ぶだけ。増えるのは job だけにする。

on:
  push:
    paths:
      - 'mule/**'
      - 'overlay/**'
      - '.github/workflows/mule-more.yml'
      - '.github/ci/**'
  workflow_dispatch:
    inputs:
      options:
        description: 'PKG_OPTIONS.mule (既定は端末のみ)'
        required: false
        default: '-canna -wnn4 -x11'

env:
  OPTIONS: ${{ inputs.options || '-canna -wnn4 -x11' }}

jobs:
  ghostbsd:
    name: GhostBSD
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: ディスクを空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: distfiles
          key: mule-2.3-tarball
      - run: sh .github/ci/fetch-distfile.sh
      - uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgsrc-ghostbsd-${{ github.run_id }}
          restore-keys: pkgsrc-ghostbsd-
      - uses: vmactions/ghostbsd-vm@v1
        with:
          envs: 'OPTIONS'
          run: sh .github/ci/build-on-bsd.sh "$OPTIONS"

  haiku:
    name: Haiku
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: ディスクを空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: distfiles
          key: mule-2.3-tarball
      - run: sh .github/ci/fetch-distfile.sh
      - uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgsrc-haiku-${{ github.run_id }}
          restore-keys: pkgsrc-haiku-
      - uses: vmactions/haiku-vm@v1
        with:
          release: 'r1beta5'
          envs: 'OPTIONS'
          # /usr が無い OS だが、置き場所は PREFIX と TREE で渡るので full で通せる。
          run: sh .github/ci/build-on-bsd.sh "$OPTIONS"

  solaris:
    name: Solaris
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: ディスクを空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: distfiles
          key: mule-2.3-tarball
      - run: sh .github/ci/fetch-distfile.sh
      - uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgsrc-solaris-${{ github.run_id }}
          restore-keys: pkgsrc-solaris-
      - uses: vmactions/solaris-vm@v1
        with:
          envs: 'OPTIONS'
          run: sh .github/ci/build-on-bsd.sh "$OPTIONS"

  tribblix:
    name: Tribblix
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: ディスクを空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: distfiles
          key: mule-2.3-tarball
      - run: sh .github/ci/fetch-distfile.sh
      - uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgsrc-tribblix-${{ github.run_id }}
          restore-keys: pkgsrc-tribblix-
      - uses: vmactions/tribblix-vm@v1
        with:
          release: '0m40'
          envs: 'OPTIONS'
          # zap で開発一式を入れないとコンパイラが無い。
          prepare: |
            zap install-overlay develop || true
          run: sh .github/ci/build-on-bsd.sh "$OPTIONS"

  openeuler:
    name: openEuler
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: ディスクを空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: distfiles
          key: mule-2.3-tarball
      - run: sh .github/ci/fetch-distfile.sh
      - uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgsrc-openeuler-${{ github.run_id }}
          restore-keys: pkgsrc-openeuler-
      - uses: vmactions/openeuler-vm@v1
        with:
          envs: 'OPTIONS'
          prepare: |
            dnf install -y gcc make curl file perl patch tar gzip xz \
              diffutils findutils which || true
          run: sh .github/ci/build-on-bsd.sh "$OPTIONS"

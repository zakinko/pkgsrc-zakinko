name: openjdk を NetBSD で建てる
run-name: ${{ inputs.pkg || 'openjdk21' }} を NetBSD ${{ inputs.release || '10.1' }} で建てる

# openjdk* を実際の NetBSD で建てて、PLIST まで起こす。
#
# いまのところ「当て物が当たる」までしか測れていない。建つかどうかは手元の
# 3 core / 2GB の箱でしか試せず、一本が数時間かかるので、五つを順に回すと
# 一日では終わらない。
#
# **VM で JDK が何分で建つかは、まだ誰も測っていない。** この repo の他の
# BSD 用 workflow は 2 分から 100 分までばらついていて、JDK の実測は無い。
# なので最初は openjdk21 を一本だけ回して、時間を知るために使う。
#
# 21 を選ぶのは bootstrap kit が ftp.NetBSD.org に在って自足するから。
# openjdk25 の kit はまだ置き場が決まっていないので、ここでは建てられない。
#
# 六時間で切られたときに最初からやり直さないよう、作りかけを cache へ置く。
# この repo の mule-otherbsd.yml と同じ形。
#
# 走らせるのは手で起こしたときだけ。毎 push で VM を起こすと、README の
# 直しで一時間の JDK build が走る。

on:
  workflow_dispatch:
    inputs:
      pkg:
        description: '建てる package'
        required: false
        default: 'openjdk21'
      release:
        description: 'NetBSD の版'
        required: false
        default: '10.1'

# package 名まで group に入れる。入れないと、四つを並べて起こしたときに
# 後から起きたものが前のものを cancel して、一本しか走らない。
concurrency:
  group: openjdk-build-${{ github.ref }}-${{ inputs.pkg || 'openjdk21' }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ inputs.pkg || 'openjdk21' }}
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      # 作りかけ -- distfile と依存の binary package -- を持ち越す。
      # 六時間で切られても次の run が依存を建て直さずに済む。
      #
      # restore と save を分ける。actions/cache 一つだと保存は job が成功した
      # ときしか走らず、openjdk8 が 5 時間 51 分で切られた run では
      # "Post ... 持ち越す: skipped" で何も残らなかった。切られた run こそ
      # 残したいので、保存は下で if: always() にしてある。
      - name: pkgsrc の作りかけを戻す
        uses: actions/cache/restore@v4
        with:
          path: |
            pkgsrc-distfiles
            pkgsrc-packages
          # 鍵は package 名を含まない。依存はどの openjdk でもほぼ同じ物
          # (gcc14 は無くなったが cmake、python、gnutls…) なので、一度
          # 建てたら全部で使う。前の形の鍵も残しておく。
          key: openjdk-netbsd-deps-${{ github.run_id }}
          restore-keys: |
            openjdk-netbsd-deps-
            openjdk-netbsd-${{ inputs.pkg || 'openjdk21' }}-

      - name: NetBSD で建てる
        uses: vmactions/netbsd-vm@v1.5.0
        # envs: は「この名前を VM へ渡す」であって、値を作る指定では
        # ない。ここで入れないと VM 側は空を受け取る。
        env:
          PKG: ${{ inputs.pkg || 'openjdk21' }}
        with:
          release: ${{ inputs.release || '10.1' }}
          mem: 8192
          cpu: 4
          usesh: true
          copyback: true
          envs: 'PKG'
          prepare: |
            /usr/sbin/pkg_add git
            # openjdk は headless にしても X に link されるので、X sets が
            # 無い箱では pkgsrc が先に止める:
            #   uses X11, but /usr/X11R7 not found
            # vmactions の image には入っていない。二箇所間違えやすく、
            # どちらも 404 が返るだけで見分けが付かない。
            #   拡張子は .tar.xz  (.tgz ではない)
            #   arch は uname -m (amd64)。uname -p は x86_64 を返す
            if [ ! -f /usr/X11R7/lib/libX11.so.7 ]; then
              REL=`uname -r | cut -d_ -f1`
              ARCH=`uname -m`
              SETS=https://cdn.NetBSD.org/pub/NetBSD/NetBSD-$REL/$ARCH/binary/sets
              for s in xbase xcomp; do
                ftp -o "/var/tmp/$s.tar.xz" "$SETS/$s.tar.xz"
                ( cd / && xzcat "/var/tmp/$s.tar.xz" | tar -xpf - )
                rm -f "/var/tmp/$s.tar.xz"
              done
              ls -l /usr/X11R7/lib/libX11.so.7
            fi
          run: |
            set -e
            export PATH=/usr/pkg/bin:/usr/pkg/sbin:$PATH
            # 既定値を置かない。置くと「渡っていない」が「openjdk21 を
            # 建てた」に化ける。実際そうなって、四本の run が四本とも 21 を
            # 建てていた。log の頭に PKGNAME が出るので気付けるが、気付く前に
            # 一時間使う。
            if [ -z "$PKG" ]; then
              echo "PKG が渡っていない。envs: と env: の両方が要る"
              exit 1
            fi
            # cd したあとに $PWD を使うと別の場所を指す。先に控える。
            WS="$PWD"

            # pkgsrc 本体は要る。浅く取る -- 履歴は使わない。
            if [ ! -d /usr/pkgsrc/mk ]; then
              git clone --depth 1 https://github.com/NetBSD/pkgsrc.git /usr/pkgsrc
            fi
            # この repo を pkgsrc の中の一つの category として置く。cache の
            # 置き場は category の中に持ち込まない -- pkgsrc が package
            # directory と読んでしまう。
            rm -rf /usr/pkgsrc/zakinko
            mkdir -p /usr/pkgsrc/zakinko
            ( cd "$WS" && pax -rw -s ',^\./\(pkgsrc-\|\.git\).*,,' . /usr/pkgsrc/zakinko/ )

            # 入っている binary package を全部外す。image と `pkg_add git`
            # が入れたものは NetBSD の binary repo 製で、pkgsrc-current が
            # 建てる版と噛み合わない。噛み合わないと build の途中で止まる:
            #
            #   pkg_add: A different version of perl-5.44.0nb1 is already
            #            installed: perl-5.42.3
            #
            # 一本ずつ外すと、次の依存で同じことが起きる。pkgsrc は要る物を
            # 自分で建てるので、ここで全部落とす。git はもう clone を終えて
            # いるので消えて構わない。
            #
            # 名前を数え上げて渡す。'*' を渡す形だと、pkg_delete が pattern
            # として受け取らなかったときに黙って何もせず、一時間後に上の
            # perl の error として出てくる。残ったら、ここで止める。
            echo "=== 外す binary package ==="
            /usr/sbin/pkg_info | wc -l
            pkgs=`/usr/sbin/pkg_info | awk '{print $1}'`
            if [ -n "$pkgs" ]; then
              /usr/sbin/pkg_delete -f $pkgs 2>&1 | tail -5 || true
            fi
            left=`/usr/sbin/pkg_info | wc -l`
            echo "残り $left"
            if [ "$left" -ne 0 ]; then
              echo "binary package が外れていない。このまま建てると pkgsrc が"
              echo "建てた版と衝突して途中で止まる。"
              /usr/sbin/pkg_info
              exit 1
            fi

            # gcc14 だけは NetBSD の binary repo から入れる。openjdk11 の
            # run (35577514287) は依存に 5 時間 13 分かかり、そのうち
            # 215 分が gcc14 だった。要るのは JDK ではなく nasm で、
            #
            #   openjdk -> libjpeg-turbo -> nasm (USE_CC_FEATURES=c23) -> gcc14
            #
            # と辿った先。NetBSD 10 の base gcc は 10.5 で C23 が無い。
            # nasm の要求は gcc14>=14.1 なので binary の版で足りる。
            # 上で全部消した理由 (image の binary と pkgsrc-current の版が
            # 噛み合わない) はここには当たらない: gcc14 の binary は
            # pkgsrc の依存を一つも持たず (pkg_summary の DEPENDS が空)、
            # /usr/pkg/gcc14 に閉じている。
            echo "=== gcc14 を binary で入れる ==="
            REL=`uname -r | cut -d_ -f1`
            PKG_PATH="https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/amd64/$REL/All" \
              /usr/sbin/pkg_add gcc14 2>&1 | tail -3
            /usr/sbin/pkg_info -e 'gcc14>=14.1' || {
              echo "gcc14 が入らなかった。nasm のために 3 時間半 gcc14 を建てる"
              echo "ことになるので、ここで止める"
              exit 1
            }
            /usr/pkg/gcc14/bin/gcc --version | head -1

            # 持ち越した物を戻す
            mkdir -p "$WS/pkgsrc-distfiles" "$WS/pkgsrc-packages"
            rm -rf /usr/pkgsrc/distfiles /usr/pkgsrc/packages
            ln -s "$WS/pkgsrc-distfiles" /usr/pkgsrc/distfiles
            ln -s "$WS/pkgsrc-packages" /usr/pkgsrc/packages

            cd /usr/pkgsrc/zakinko/$PKG
            echo "=== 何を建てるか ==="
            make show-var VARNAME=PKGNAME
            # 頼んだ package と、いま解けている PKGNAME が同じ線か
            case "`make show-var VARNAME=PKGNAME`" in
              "$PKG"-*) ;;
              *) echo "$PKG を頼んだのに別の物が解けている"; exit 1 ;;
            esac
            make show-var VARNAME=DISTNAME
            make show-var VARNAME=PATCHFILES

            echo "=== 建てる ==="
            date
            # job の上限 (350 分) より手前で自分から止める。上限で殺されると
            # vmactions は workspace を持ち帰らず、建て終えた依存の binary
            # package まで消える。timeout(1) で止めた場合は 0 で抜けて
            # 持ち帰らせ、runner 側の step が印を見て job を赤くする。
            # VM の起動と依存の展開に使った分を引いて 300 分。
            # 失敗しても非 0 で抜けない。vmactions は step が失敗すると
            # workspace を持ち帰らず、openjdk11 の run (35611322500) では
            # PLIST 検査で落ちたときに 1 時間 55 分ぶんの依存が
            #
            #   Path Validation Error: Path(s) specified in the action for
            #   caching do(es) not exist, hence no cache is being saved.
            #
            # と消えた。結果は file に書き、runner 側の step が読んで赤くする。
            rm -f "$WS/BUILD_TIMED_OUT" "$WS/BUILD_FAILED"
            timeout 300m make package; rc=$?
            date
            if [ "$rc" -eq 124 ]; then
              echo "300 分で止めた。依存の binary package は持ち帰る"
              touch "$WS/BUILD_TIMED_OUT"
            elif [ "$rc" -ne 0 ]; then
              echo "make package が $rc で落ちた。依存の binary package は持ち帰る"
              echo "$rc" > "$WS/BUILD_FAILED"
            fi

            echo "=== PLIST を起こす ==="
            make print-PLIST > "$WS/PLIST.new" || true
            wc -l "$WS/PLIST.new" || true

      - name: 起こした PLIST を持ち帰る
        uses: actions/upload-artifact@v4
        with:
          name: PLIST-${{ inputs.pkg || 'openjdk21' }}
          path: PLIST.new
          if-no-files-found: warn
        if: always()

      - name: pkgsrc の作りかけを残す
        uses: actions/cache/save@v4
        with:
          path: |
            pkgsrc-distfiles
            pkgsrc-packages
          key: openjdk-netbsd-deps-${{ github.run_id }}
        if: always()

      # VM の中では時間切れでも失敗でも 0 で抜けているので、ここで赤くする。
      - name: 時間切れか失敗なら落とす
        run: |
          if [ -f BUILD_TIMED_OUT ]; then
            echo "make package が 300 分で止まった。作りかけは cache に残した"
            exit 1
          fi
          if [ -f BUILD_FAILED ]; then
            echo "make package が $(cat BUILD_FAILED) で落ちた。log は上。作りかけは cache に残した"
            exit 1
          fi

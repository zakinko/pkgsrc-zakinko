name: 上流の 17 個

# 上流 pkgsrc から引き取った 17 個 (emacs20/21 でしか建たない elisp の層) を、
# 実際に建てる。pkglint と Emacs の reader は手元で通せるが、建つかどうかは
# emacs20 か emacs21 が入った箱でしか分からない。
#
#	ERROR: Accepted versions are: emacs21 emacs21nox emacs20
#	ERROR: No valid Emacs version installed found
#
# techne は EMACS_TYPE=emacs30nox で、入れ替えると elisp を建てている他の
# セッションが全部止まる。実際に一度止めた。だから使い捨ての VM で建てる。
#
# Vultr に箱を立てる案もあったが、netbsd-ci-images に i386 のイメージが
# 6.1.5 から 11.0 まで揃っていて、鍵も課金も要らずに済む。
#
# job の上限は 350 分。emacs 本体を建てるだけで一時間近くかかるので、
# emacs20 の側と emacs21 の側を別の job に分ける。

on:
  push:
    paths:
      - 'leim2[01]/**'
      - 'mule-ucs/**'
      - 'tamago/**'
      - 'iiimecf/**'
      - 'calc/**'
      - 'nxml-mode/**'
      - 'pcl-cvs/**'
      - 'emacs-ilisp/**'
      - 'jde/**'
      - 'w3/**'
      - 'xemacs*/**'
      - '.github/workflows/elisp17.yml'
      - '.github/ci/verify-elisp17.sh'
  workflow_dispatch:
    inputs:
      versions:
        description: '対象の Emacs (例 "20")。空なら 20 と 21'
        required: false
      image:
        description: 'イメージ。空なら i386-9.4'
        required: false
      lispdir:
        description: 'yes にすると lisp の置き場を版の下へ動かして回す (意図して赤くなる)'
        required: false
        default: 'no'

# push で続けて直したときは古い方を捨てる。手で回したものは run ごとに別の
# group にして、走っている run の後ろで待たせない。一つの group に全部を入れて
# cancel-in-progress: false にしていたので、xemacs-packages の 4 時間の裏で
# emacs20 の再走が pending のまま動かなかった。
concurrency:
  group: elisp17-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.q.outputs.versions }}
      image: ${{ steps.q.outputs.image }}
    steps:
      - id: q
        env:
          IN_V: ${{ inputs.versions }}
          IN_I: ${{ inputs.image }}
        run: |
          set -e
          [ -n "$IN_V" ] && V="$IN_V" || V="20 21"
          [ -n "$IN_I" ] && I="$IN_I" || I="i386-9.4"
          printf 'versions=%s\n' "$(printf '%s\n' $V | jq -Rrn '[inputs] | tostring')" >> $GITHUB_OUTPUT
          printf 'image=%s\n' "$I" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        version: ${{ fromJSON(needs.plan.outputs.versions) }}
    name: emacs${{ matrix.version }} の 17 個
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: qemu を入れて KVM を通す
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils netcat-openbsd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          # trigger は非同期なので、直後に -w を見ると間に合わないことがある。
          # run 35069883047 では同じ run の中で emacs20 が「KVM 無し」、
          # emacs21 が「KVM あり」になった。
          #
          # 遅くなるからではない。netbsd-ci-images の runvm.sh が起動の直前に
          # もう一度 -w /dev/kvm を見て -enable-kvm を付けるので、ここで
          # 取りこぼしてもゲストは KVM で動く。実際「KVM 無し」と警告した回も
          # 起動行は KVM 付きで、所要時間も 23 分と 24 分で変わらなかった。
          # 直す理由は、警告が嘘をつかないようにするため。
          sudo udevadm settle || true
          if [ -e /dev/kvm ] && [ ! -w /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi
          # -w 一つだと「device が無い」と「書けない」が同じ顔になる。
          # 次に遅い回が出たとき、どちらを直すのか分からなくなる。
          if [ -w /dev/kvm ]; then
            echo "KVM あり"
          elif [ -e /dev/kvm ]; then
            echo "::warning::/dev/kvm は在るが書けない。相当遅い"
          else
            echo "::warning::/dev/kvm が無い。相当遅い"
          fi

      - name: 建てる
        env:
          # 主対象と、それが読むものを連れていく。emacs20/21 の側は
          # Makefile.common と PLIST と modules.mk を読むので一つでは足りない。
          # emacs20 に nox11 の兄弟は無い。emacs${{ matrix.version }}-nox11 と
          # 書いていたので、20 の側で tar が Cannot stat を出していた。両方を
          # 名前で並べる。使わない側が一つ増えるだけで、転送は数十 KB。
          UPSTREAM_PKG: >-
            zakinko/emacs20 zakinko/emacs21 zakinko/emacs21-nox11
            zakinko/emacs
            zakinko/leim20 zakinko/leim21 zakinko/mule-ucs zakinko/tamago
            zakinko/iiimecf zakinko/calc zakinko/nxml-mode zakinko/pcl-cvs
            zakinko/emacs-ilisp zakinko/jde zakinko/w3 zakinko/rsltc
          VERIFY_SCRIPT: verify-elisp17.sh
          VERIFY_OPTS: ${{ matrix.version }}${{ inputs.lispdir == 'yes' && ':lispdir' || '' }}
        run: sh .github/ci/run-in-qemu.sh '${{ needs.plan.outputs.image }}'

      - name: 転けたらコンソールを出す
        if: failure()
        run: tail -80 .vm/${{ needs.plan.outputs.image }}.console.log 2>/dev/null || true

  # XEmacs は emacs20/21 を要らない。単体で建つので別の job にする。
  # 本体が Emacs 級の大物で、xemacs-packages は 130 個の tarball を落とす
  # ので、上の 17 個と同じ job に入れると 350 分に当たる。
  xemacs:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pkg: [xemacs, xemacs-current, xemacs-packages]
    name: ${{ matrix.pkg }}
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: qemu を入れて KVM を通す
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils netcat-openbsd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          # trigger は非同期なので、直後に -w を見ると間に合わないことがある。
          # run 35069883047 では同じ run の中で emacs20 が「KVM 無し」、
          # emacs21 が「KVM あり」になった。
          #
          # 遅くなるからではない。netbsd-ci-images の runvm.sh が起動の直前に
          # もう一度 -w /dev/kvm を見て -enable-kvm を付けるので、ここで
          # 取りこぼしてもゲストは KVM で動く。実際「KVM 無し」と警告した回も
          # 起動行は KVM 付きで、所要時間も 23 分と 24 分で変わらなかった。
          # 直す理由は、警告が嘘をつかないようにするため。
          sudo udevadm settle || true
          if [ -e /dev/kvm ] && [ ! -w /dev/kvm ]; then
            sudo chmod 666 /dev/kvm || true
          fi
          # -w 一つだと「device が無い」と「書けない」が同じ顔になる。
          # 次に遅い回が出たとき、どちらを直すのか分からなくなる。
          if [ -w /dev/kvm ]; then
            echo "KVM あり"
          elif [ -e /dev/kvm ]; then
            echo "::warning::/dev/kvm は在るが書けない。相当遅い"
          else
            echo "::warning::/dev/kvm が無い。相当遅い"
          fi

      - name: 建てる
        env:
          # xemacs と xemacs-current は Makefile.common と PLIST と
          # buildlink3.mk と version.mk を互いに読まないので単体で足りる。
          UPSTREAM_PKG: zakinko/${{ matrix.pkg }}
          VERIFY_SCRIPT: verify-pkg.sh
        run: sh .github/ci/run-in-qemu.sh '${{ needs.plan.outputs.image }}'

      - name: 転けたらコンソールを出す
        if: failure()
        run: tail -80 .vm/${{ needs.plan.outputs.image }}.console.log 2>/dev/null || true

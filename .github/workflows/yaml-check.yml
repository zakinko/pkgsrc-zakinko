name: workflow の yaml を検査する

# 同じ mapping に同じ key が二度在ると、GitHub は workflow ごと拒否する。
# しかも拒否の出方が分かりにくい。run は作られるが jobs が 0 件で即座に
# failure になり、workflow が一覧からも消え、log には何も残らない。実際に
# 二度、起動すらしていない run を「走っている」と読んでいた。
#
# ruby も python も後勝ちで黙って通すので、目でも既存の道具でも出ない。
# 自前で数える。

on:
  push:
    paths:
      - '.github/workflows/*.yml'
      - '.github/ci/*.sh'
      - '.github/ci/yaml-dupkey.rb'
      - '.github/ci/check-grep-portability.sh'
  pull_request:
    paths:
      - '.github/workflows/*.yml'
      - '.github/ci/*.sh'
      - '.github/ci/yaml-dupkey.rb'
      - '.github/ci/check-grep-portability.sh'
  workflow_dispatch:

concurrency:
  group: yaml-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dupkey:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: 検査そのものを先に試す
        run: |
          # 既知の不良品を通して、拾えることを確かめてから本番に使う。
          # 最初に書いた検査は Document node を素通りしていて、壊れた file を
          # 「重複なし」と答えた。自己試験が無ければ気付かない。
          d="$RUNNER_TEMP/dupkey"; mkdir -p "$d"
          printf 'a:\n  b: 1\n  b: 2\n' > "$d/bad.yml"
          if ruby .github/ci/yaml-dupkey.rb "$d/bad.yml"; then
            echo "!! 検査が既知の不良品を通した。検査のほうが壊れている"
            exit 1
          fi
          echo "検査は不良品を拾える"
      - name: 全 workflow を検査する
        run: ruby .github/ci/yaml-dupkey.rb .github/workflows/*.yml

  grep-portability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      # POSIX BRE が定めない escape (\| \s \d \w \+ \?) を -E 無しの grep で
      # 使うと、解さない箱では grep -q が常に偽、grep -c が常に 0 になる。
      # error は出ないので、判定に使っていると黙って反対の答が出る。
      #
      # この罠を注記したコメントは既に木の二箇所に在った。それでも他の八件は
      # 残っていて、うち四件は判定に使っていた (verify-gdb7.sh の三つの if と
      # verify-elisp17.sh の警告の数え上げ。後者は「警告 0 件」と答え続ける)。
      # コメントは踏んだ場所にしか効かないので、機械に置く。
      #
      # script 自身が自己試験を先頭に持っている。既知の不良品 3 件を拾えて、
      # 直した物で 0 件になることを確かめてから木を見る。
      - name: -E 無しの grep に移植性の無い escape が無いか
        run: sh .github/ci/check-grep-portability.sh
      # BUILD_DEADLINE は run_bounded を通したときだけ効く。最初 TREE_PKGS の
      # 輪にしか掛けておらず、PKGS の輪 (go-bin はこちら) には一度も効いて
      # いなかった。OpenBSD の二箱が 350 分の job timeout に当たって cancel
      # され、cache も残らなかった。効いているつもりで効いていない仕掛けは、
      # 緑と同じ顔で出る。
      - name: 検査の呼び出しが run_bounded を通っているか
        run: |
          bad=$(grep -n 'sh "$WS/.github/ci/verify-' .github/ci/build-on-bsd.sh |
                grep -v 'run_bounded sh' || true)
          if [ -n "$bad" ]; then
            echo "!! run_bounded を通らない検査の呼び出しが在る:"
            printf '%s\n' "$bad" | sed 's/^/   /'
            echo "   BUILD_DEADLINE が効かず、job timeout で cache ごと消える。"
            exit 1
          fi
          n=$(grep -c 'run_bounded sh' .github/ci/build-on-bsd.sh)
          echo "run_bounded を通る呼び出し: $n 件"
          [ "$n" -ge 3 ] || { echo "!! 少なすぎる。輪が抜けている"; exit 1; }
          # 定義が最初の使用より前に在るか。後ろに在ると command not found。
          d=$(grep -n '^run_bounded() {' .github/ci/build-on-bsd.sh | cut -d: -f1)
          u=$(grep -n 'run_bounded sh' .github/ci/build-on-bsd.sh | head -1 | cut -d: -f1)
          echo "定義 $d 行、最初の使用 $u 行"
          [ "$d" -lt "$u" ] || { echo "!! 定義が使用より後ろに在る"; exit 1; }

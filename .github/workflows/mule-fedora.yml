name: mule (Fedora)

# Mule 1.1 と 2.3 を Fedora 44 のコンテナで組む。
#
# mule-linux.yml (Debian / Ubuntu / AlmaLinux / Rocky / CentOS Stream) とは
# 別に置いている。あちらは持ち主が別で、いま直しを抱えているため。こちらは
# Fedora だけを見る。
#
# 二つ並べる意味は、1.1 と 2.3 で glibc と gcc の当たり方が違うのを見ること。
# NetBSD では 1.1 が clang/gcc 14 のエラー五種類で 0 件、2.3 が 1474 件ある。
# Fedora 44 の gcc は 15 なので、2.3 は暗黙宣言の段で止まる公算が高い。
# 止まる場所が同じかどうかを見る。
#
# X は native にする。1.1 の Makefile は x11.buildlink3.mk を無条件に読むので、
# modular にすると X を素から建てて何時間もかかる。Fedora の devel を入れて
# X11BASE=/usr で当てる。2.3 は -x11 で外せるが、条件を揃えるため同じにする。
#
# 見込みは薄い。pkgsrc の Linux 対応は動くが、1995 年の tree が Fedora 44 の
# glibc とヘッダで通るかは別の話で、configure の機種判定か、暗黙宣言か、
# 可変長引数のどこかで止まると思う。止まった場所そのものが結果になる。

on:
  workflow_dispatch:
    inputs:
      packages:
        description: '組むもの (mule / mule2 / "mule mule2")'
        required: false
        default: 'mule mule2'
      options:
        description: 'PKG_OPTIONS (既定は端末のみ)'
        required: false
        default: '-canna -wnn4 -x11'

      make_flags:
        description: 'MAKE_FLAGS (誤りを全部集めるなら -k)'
        required: false
        default: ''

jobs:
  fedora:
    name: Fedora 44 / ${{ matrix.pkg }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        pkg: [mule, mule2]
    container:
      image: fedora:44
    steps:
      - name: 道具を入れる
        run: |
          set -e
          dnf install -y -q gcc gcc-c++ make curl ca-certificates file \
            perl patch tar gzip xz git diffutils findutils which sudo \
            libX11-devel libXt-devel libXaw-devel libXmu-devel libXext-devel \
            libXpm-devel xorg-x11-proto-devel ncurses-devel \
            hostname procps-ng iproute texinfo
          # hostname は pkgsrc の native X の検査が見ている。無いと
          #   /usr: X11_TYPE=native but xbase set is not installed
          #   (missing: hostname)
          # で can-be-built-here.mk が止める。Fedora の最小コンテナには
          # 入っていない。
          cc --version | head -1
          ldd --version | head -1
          cat /etc/fedora-release

      - uses: actions/checkout@v4

      - name: 組む
        env:
          PKGS: ${{ matrix.pkg }}
          VERIFY: basic
          # VERIFY=basic は verify-pkg.sh を呼ぶ。あちらは PKG_OPTIONS を
          # 渡さないので、OPTS だけでは option が package に届かない。
          # PKG_DEFAULT_OPTIONS は環境変数として bmake が拾うので、こちらで
          # 全 package に効かせる。
          PKG_DEFAULT_OPTIONS: ${{ inputs.options || '-canna -wnn4 -x11' }}
          # 1995 年の木は一つ直すたびに次の一つが出る。誤りを一度に
          # 全部見たいときは -k を渡す。GNU make は落ちた target を
          # 飛ばして最後まで進み、まとめて報告する。
          MAKE_FLAGS: ${{ inputs.make_flags || '' }}
          # native をやめた。can-be-built-here.mk の検査が
          #   /usr: X11_TYPE=native but xbase set is not installed
          #   (missing: digest install-info makeinfo patch)
          # と言って止める。挙がっているのは X ではなく pkgsrc の道具で、
          # native X を選ぶと NetBSD の base set が在る前提の検査に入って
          # しまうためらしい。modular なら pkgsrc が自分で用意する。
          #
          # 2.3 は -x11 なので X は要らず、modular でも何も建たない。1.1 は
          # x11.buildlink3.mk を無条件に読むので、ここで X を素から建てる
          # ことになる。時間はかかるが、それも含めて「Fedora で建つか」の
          # 答えになる。
          X11_TYPE: modular
          OPTS: ${{ inputs.options || '-canna -wnn4 -x11' }}
        run: sh .github/ci/build-on-bsd.sh "$OPTS"

      - name: 止まった場所を出す
        if: failure()
        run: |
          set +e
          # /tmp/build.log は誰も作っていなかった。compile 行は make -n から
          # 取る。前処理の出力を grep する方法は当てにならない
          # (extern int open は extern int openat にも当たる) ので、実際に
          # 組んで、引数を一つずつ外し、どれで通るようになるかを見る。
          W=$(find / -path '*mule2/work/mule/lib-src/movemail.c' 2>/dev/null | head -1)
          [ -n "$W" ] || { echo "movemail.c が無い"; exit 0; }
          cd "$(dirname "$W")"
          L=$(make -n movemail 2>/dev/null | grep -m1 'movemail\.c')
          echo "compile 行: ${L:-取れない}"
          [ -n "$L" ] || exit 0
          ARGS=$(echo "$L" | sed -e 's/^[^ ]* //' -e 's/ -o movemail$//')
          printf 'そのまま => '
          cc $ARGS -c -o /dev/null 2>/tmp/e && echo 通る || echo "暗黙宣言 $(grep -c 'implicit declaration' /tmp/e) 件"
          for drop in -I. -I../src -no-pie -O2 -fno-pie -fcommon -D_BSD_SOURCE -D_DEFAULT_SOURCE -Demacs -DHAVE_CONFIG_H; do
            REST=$(echo "$ARGS" | tr ' ' '\n' | grep -vx -- "$drop" | tr '\n' ' ')
            printf '%-20s を外す => ' "$drop"
            cc $REST -c -o /dev/null 2>/tmp/e && echo 通る || echo "暗黙宣言 $(grep -c 'implicit declaration' /tmp/e) 件"
          done
          echo "=== 素の一枚は通るか"
          printf '#include <fcntl.h>\nint main(void){return open("/dev/null",0);}\n' > /tmp/q.c
          cc $ARGS -c -o /dev/null /tmp/q.c 2>&1 | head -3

name: elisp-one (一つだけ確かめる)

# zakinko/ の elisp package を一つ、新しい Emacs を入れた素の箱で建てる。
#
# elisp17.yml は emacs20/21 と XEmacs しか持たず、emacs-new.yml は 408 個を
# 一括で回す口なので、版を上げた package を一つ試す場所が無かった。
#
# 押したときだけ走る。package と箱と Emacs の型を渡す。

on:
  workflow_dispatch:
    inputs:
      package:
        description: '建てる package (例 zakinko/elscreen)'
        required: true
      image:
        description: 'イメージ'
        required: false
        default: amd64-11.0
      emacs:
        description: 'Emacs の型 (emacs29nox / emacs30nox / emacs31nox)'
        required: false
        default: emacs30nox
      pkgsrc:
        description: 'ツリー (current / 2026Q2)'
        required: false
        default: current

concurrency:
  group: elisp-one-${{ inputs.package }}-${{ inputs.image }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    name: ${{ inputs.package }} / ${{ inputs.emacs }} / ${{ inputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: qemu を入れて KVM を通す
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils netcat-openbsd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo udevadm settle --timeout=10 || true
          [ -w /dev/kvm ] || sudo chmod 666 /dev/kvm 2>/dev/null || true
          # 負けても遅くはならない。accel は起動時に再判定される。
          [ -w /dev/kvm ] && echo "KVM あり" || echo "::warning::/dev/kvm が使えない (起動時に再判定される)"

      - name: 建てる
        env:
          UPSTREAM_PKG: ${{ inputs.package }}
          VERIFY_SCRIPT: verify-elisp-one.sh
          VERIFY_OPTS: ${{ inputs.emacs }}
          # binary package は使わない。公式の物は四半期枝でしか作られておらず
          # (.../x86_64/11.0/ は 11.0_2026Q2 への redirect で別物ではない)、
          # current の木に四半期の binary を混ぜると版が噛み合わない。
          # 依存は素から建てる。emacs30-nox11 の分だけ時間が延びる。
          # 既定を current にしてある。2026Q2 の
          # editors/emacs30-nox11/version.mk 1.1 が
          #   _EMACS_REQD= emacs30-no-x11>=30.1<31
          # と書いていて、package が名乗る emacs30-nox11 と合わない。あの枝では
          # emacs30nox でどの elisp package も建たない。trunk では 2026-08-15 の
          # 1.2 で直っている。
          PKGSRC_URL: http://cdn.netbsd.org/pub/pkgsrc/${{ inputs.pkgsrc == '2026Q2' && 'pkgsrc-2026Q2' || 'current' }}/pkgsrc.tar.gz
        run: sh .github/ci/run-in-qemu.sh '${{ inputs.image }}'

      - name: 転けたらコンソールを出す
        if: failure()
        run: tail -80 .vm/*.console.log 2>/dev/null || true

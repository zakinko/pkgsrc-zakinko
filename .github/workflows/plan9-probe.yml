name: plan9 probe

# Plan 9 で pkgsrc の bootstrap がどこまで行くかを測るだけ。直すのはその後。
#
# 2026-09-24 に起こし直す。前の三回は cancel と failure で、偵察の出力を
# 一行も得ていない。にもかかわらず go-bin の platform.mk に「pkgsrc は
# そこで走らない」と書いていた。根拠は mk/platform/Plan9.mk が無いという
# 不在だけで、実機では測れていなかった。
# 2013 年の移植の試み (9p.io の contrib/staal1978) は bmake を建てる所で
# 止まったと README に書いてあるが、今も同じかは誰も測っていない。
#
# 注意が二つある。
#
# この箱の shell は rc で、sh は無い。POSIX shell は APE の下に在るはず
# なので、まず rc で在り処を探してから渡す。
#
# そして run: は一行で書く。vmactions は run: の行と行の間に && を挿し込む
# ので、複数行の rc を書くと `for(...){ && if(...){` という閉じない形に
# なり、rc が入力待ちのまま一文字も出さずに座る。run 35689668395 は
# これで 88 分黙ったあと 90 分の timeout で切られた。rc の中の区切りは
# 改行ではなく ; を使う。

on:
  workflow_dispatch:
  push:
    branches: [thttpd, go-bin]
    paths: [.github/workflows/plan9-probe.yml, .github/ci/probe-plan9.sh]

concurrency:
  group: plan9-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Plan 9 (9front ${{ matrix.release }})
    runs-on: ubuntu-latest
    # 黙って座られたときに 90 分使わない。bootstrap まで行っても届く長さ。
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        release: ['11952']
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: vmactions/plan9-vm@v1
        with:
          release: ${{ matrix.release }}
          # 一行。改行を入れると && が挿し込まれて rc が閉じなくなる。
          run: echo '########## rc から見た箱 ##########'; cat /dev/osversion; echo 'objtype='$objtype; echo 'path='$path; echo '--- /bin/ape'; ls /bin/ape >[2]/dev/null; echo '########## POSIX shell を探す ##########'; posix=(); for(s in /bin/ape/psh /bin/ape/sh /rc/bin/ape/psh /$objtype/bin/ape/psh){ if(test -x $s){ echo '  見つかった: '$s; posix=($posix $s) } }; if(~ $#posix 0){ echo '  !! POSIX shell が無い。ここで終わり'; exit '' }; echo '########## 偵察 script を渡す ##########'; $posix(1) .github/ci/probe-plan9.sh

name: plan9 probe

# Plan 9 で pkgsrc の bootstrap がどこまで行くかを測るだけ。直すのはその後。
# 2013 年の移植の試み (9p.io の contrib/staal1978) は bmake を建てる所で
# 止まったと README に書いてあるが、今も同じかは誰も測っていない。
#
# 注意: この箱の shell は rc で、sh は無い。POSIX shell は APE の下に
# 在る (在るはず) なので、まず rc で在り処を探してから渡す。

on:
  workflow_dispatch:
  push:
    branches: [thttpd, go-bin]
    paths: [.github/workflows/plan9-probe.yml, .github/ci/probe-plan9.sh]

concurrency:
  group: plan9-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Plan 9 (9front ${{ matrix.release }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        release: ['11952']
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: vmactions/plan9-vm@v1
        with:
          release: ${{ matrix.release }}
          run: |
            echo '########## rc から見た箱 ##########'
            cat /dev/osversion
            echo 'objtype='$objtype
            echo 'path='$path
            echo '--- /bin に ape は在るか'
            ls /bin | grep ape
            echo '--- /bin/ape の中身'
            ls /bin/ape
            echo '########## POSIX shell を探す ##########'
            posix=()
            for(s in /bin/ape/psh /bin/ape/sh /rc/bin/ape/psh /$objtype/bin/ape/psh){
                if(test -x $s){
                    echo '  見つかった: '$s
                    posix=($posix $s)
                }
            }
            if(~ $#posix 0){
                echo '  !! POSIX shell が無い。ここで終わり'
                exit 0
            }
            echo '########## 偵察 script を渡す ##########'
            $posix(1) .github/ci/probe-plan9.sh

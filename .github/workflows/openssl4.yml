name: openssl 4.1.0 on every platform

# zakinko/openssl (OpenSSL 4.1.0、木の security/openssl の置き換え) を、
# CI で起こせる pkgsrc の platform 全部で組み、入れて走らせ、上流の
# make test を回す。検査は verify-openssl.sh で、OPENSSL_TEST=yes が
# make test を、SKIP_PKGLINT=yes が pkglint (lang/go から組むことになる)
# を外す。
#
# 箱は vmactions の conf と anyvm-org の release asset を 2026-11-12 に
# 引いて、在るものを並べた。vmactions に無い NetBSD/i386 と FreeBSD/i386
# は zakinko/netbsd-ci-images の image と FreeBSD の配布 image を qemu で
# 起こす (run-in-qemu.sh、run-freebsd-i386.sh)。
#
# x86_64 の箱は KVM で走る。aarch64、riscv64、sparc64、powerpc64 は TCG で、
# perl から組むので時間切れになりうる。

on:
  workflow_dispatch:
  push:
    branches: [ci-openssl4]
    paths:
      - 'openssl/**'
      - '.github/workflows/openssl4.yml'
      - '.github/ci/verify-openssl.sh'
      - '.github/ci/build-on-bsd.sh'
      - '.github/ci/run-in-qemu.sh'
      - '.github/ci/run-freebsd-i386.sh'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_ENV: PKGS='' CARRY=openssl TREE_PKGS=zakinko/openssl OPENSSL_TEST=yes SKIP_PKGLINT=yes

jobs:
  netbsd:
    name: NetBSD 11.1 ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, riscv64, sparc64]
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: vmactions/netbsd-vm@v1
        with:
          release: '11.1'
          arch: ${{ matrix.arch }}
          mem: 8192
          copyback: false
          run: env ${{ env.CI_ENV }} sh .github/ci/build-on-bsd.sh

  freebsd:
    name: FreeBSD 15.1 ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, riscv64, powerpc64]
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '15.1'
          arch: ${{ matrix.arch }}
          mem: 8192
          copyback: false
          run: env ${{ env.CI_ENV }} sh .github/ci/build-on-bsd.sh

  openbsd:
    name: OpenBSD 8.0 ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64, riscv64, sparc64]
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: vmactions/openbsd-vm@v1
        with:
          release: '8.0'
          arch: ${{ matrix.arch }}
          mem: 8192
          copyback: false
          run: env ${{ env.CI_ENV }} sh .github/ci/build-on-bsd.sh

  dragonfly:
    name: DragonFly 6.4.2 x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: vmactions/dragonflybsd-vm@v1
        with:
          release: '6.4.2'
          mem: 8192
          copyback: false
          run: env ${{ env.CI_ENV }} sh .github/ci/build-on-bsd.sh

  solaris:
    name: Solaris 11.4 x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: vmactions/solaris-vm@v1
        with:
          release: '11.4-gcc'
          mem: 8192
          copyback: false
          # bootstrap の libnbcompat が Solaris で chflags を呼んで落ちる。
          # 木の側の bug で、当て物の理由は tree-patch-nbcompat-solaris.sh。
          run: env ${{ env.CI_ENV }} TREE_PATCH=.github/ci/tree-patch-nbcompat-solaris.sh sh .github/ci/build-on-bsd.sh

  omnios:
    name: OmniOS r151058 x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: vmactions/omnios-vm@v1
        with:
          release: 'r151058-build'
          mem: 8192
          copyback: false
          # base の tar は pax 拡張ヘッダを知らない (build-on-bsd.sh)。
          # pkg.omnios.org が TLS の途中で切れることがある (run 43081520291
          # で gnu-tar が入らず、素の tar がツリーの展開で落ちた)。数回試す。
          prepare: |
            for i in 1 2 3 4; do pkg install archiver/gnu-tar; r=$?; [ $r = 0 ] || [ $r = 4 ] && break; sleep 30; done
          run: env ${{ env.CI_ENV }} sh .github/ci/build-on-bsd.sh

  openindiana:
    name: OpenIndiana 202610 x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: vmactions/openindiana-vm@v1
        with:
          release: '202610-build'
          mem: 8192
          copyback: false
          # pkg.omnios.org が TLS の途中で切れることがある (run 43081520291
          # で gnu-tar が入らず、素の tar がツリーの展開で落ちた)。数回試す。
          prepare: |
            for i in 1 2 3 4; do pkg install archiver/gnu-tar; r=$?; [ $r = 0 ] || [ $r = 4 ] && break; sleep 30; done
          run: env ${{ env.CI_ENV }} sh .github/ci/build-on-bsd.sh

  # vmactions に i386 の NetBSD は無い。netbsd-ci-images の image を使う。
  netbsd-i386:
    name: NetBSD 11.0 i386
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - name: qemu と KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils netcat-openbsd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo udevadm settle --timeout=10 || true
          [ -w /dev/kvm ] || sudo chmod 666 /dev/kvm 2>/dev/null || true
      - name: 組んで確かめる
        env:
          UPSTREAM_PKG: zakinko/openssl
          VERIFY_SCRIPT: verify-openssl.sh
          VERIFY_OPTS: test nolint
          PKGSRC_URL: http://cdn.netbsd.org/pub/pkgsrc/current/pkgsrc.tar.gz
        run: sh .github/ci/run-in-qemu.sh i386-11.0

  # FreeBSD 15 は i386 を落としたので、i386 は 14.4 の配布 image で見る。
  freebsd-i386:
    name: FreeBSD 14.4 i386
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - name: qemu と KVM
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils netcat-openbsd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo udevadm settle --timeout=10 || true
          [ -w /dev/kvm ] || sudo chmod 666 /dev/kvm 2>/dev/null || true
      - name: 組んで確かめる
        env:
          FREEBSD_REL: '14.4'
          SHIP: openssl
          PKGS: ''
          CARRY: openssl
          TREE_PKGS: zakinko/openssl
          OPENSSL_TEST: 'yes'
          SKIP_PKGLINT: 'yes'
        run: sh .github/ci/run-freebsd-i386.sh

  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'Debian 13 x86_64',  runner: ubuntu-latest,    image: 'debian:13',     pm: apt }
          - { name: 'Debian 13 aarch64', runner: ubuntu-24.04-arm, image: 'debian:13',     pm: apt }
          - { name: 'Fedora x86_64',     runner: ubuntu-latest,    image: 'fedora:latest', pm: dnf }
          - { name: 'Alpine x86_64',     runner: ubuntu-latest,    image: 'alpine:latest', pm: apk }
    container: ${{ matrix.image }}
    steps:
      - name: 道具を入れる
        run: |
          set -e
          case '${{ matrix.pm }}' in
          apt)
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              build-essential curl ca-certificates file perl patch \
              tar gzip xz-utils git procps
            ;;
          dnf)
            dnf install -y -q gcc gcc-c++ make curl ca-certificates file \
              perl patch tar gzip xz git diffutils findutils which procps-ng
            ;;
          apk)
            apk add --no-cache build-base curl ca-certificates file perl \
              patch tar gzip xz git bash procps coreutils diffutils findutils
            ;;
          esac
      - uses: actions/checkout@v4
      - run: env PKGS='' CARRY=openssl TREE_PKGS=zakinko/openssl OPENSSL_TEST=yes SKIP_PKGLINT=yes sh .github/ci/build-on-bsd.sh

  macos:
    name: macOS ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel]
    steps:
      - uses: actions/checkout@v4
      - run: |
          uname -m
          sudo env PKGS='' CARRY=openssl TREE_PKGS=zakinko/openssl \
            OPENSSL_TEST=yes SKIP_PKGLINT=yes \
            PKGSRC_BASE=/Users/runner/pkgsrcwork sh .github/ci/build-on-bsd.sh

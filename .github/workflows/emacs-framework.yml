name: emacs の枠組みを i386 で

# editors/emacs/modules.mk への変更を、手元と別の箱で踏む。
#
# 手元は NetBSD 11.0/amd64 の一台しか無い。67 個の一周も、置き場を版の
# 下へ移したあと Emacs が届くかの確認も、そこでしか測っていない。
# **一つの箱で測ったものは、その箱のことしか言っていない。**
#
# i386 を選ぶのは、この repo が元々そこを見ているからと、64bit で隠れる
# 類 (LP64 で broken と印の付いた devel/gentle など) がここでは別の顔を
# するため。Vultr を立てる案もあったが、netbsd-ci-images に i386 の
# イメージが揃っていて鍵も課金も要らない。
#
# 主対象は modules.mk なので、ツリーは current を見る。四半期枝だと
# modules.mk の版が違い、置き換えた瞬間に測っているものが変わる。
# そのずれは verify script が .orig と byte で突き合わせて止める。

on:
  push:
    paths:
      - 'emacs-framework/**'
      - '.github/ci/verify-emacs-framework.sh'
      - '.github/ci/fetch-trunk-files.sh'
      - '.github/workflows/emacs-framework.yml'
  workflow_dispatch:
    inputs:
      pkgs:
        description: '建てる package。空なら六つ'
        required: false

concurrency:
  group: emacs-framework-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  x86:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: i386-11.0
            arch: i386
          - image: amd64-11.0
            arch: x86_64
    name: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: qemu を入れて KVM を通す
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils netcat-openbsd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          # trigger は非同期。settle で待ち、駄目なら chmod する。待たずに -w を
          # 読んで負けると TCG に落ち、そのまま何時間も回る。run 35069883047 の
          # 四つの job は同じ runner の同じ段を通って 23m / 33m / 3h23m / 3h30m
          # に割れた。速い方が KVM を取れた側である。
          sudo udevadm settle --timeout=10 || true
          [ -w /dev/kvm ] || sudo chmod 666 /dev/kvm 2>/dev/null || true
          # -w だけだと「device が無い」と「在るが書けない」が同じ顔で出る。
          if [ -w /dev/kvm ]; then
            echo "KVM あり"
          elif [ -e /dev/kvm ]; then
            echo "::warning::/dev/kvm は在るが書けない。TCG になり相当遅い"
          else
            echo "::warning::/dev/kvm が無い。TCG になり相当遅い"
          fi

      - name: trunk の現物を当て先に敷く
        # ゲストの木は image を焼いた日で止まっている。送る相手は trunk
        # なので、差分が触る file は今日の trunk から取って被せる。
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/ci/fetch-trunk-files.sh emacs-framework

      - name: 枠組みを踏む
        env:
          UPSTREAM_PKG: zakinko/emacs-framework
          VERIFY_SCRIPT: verify-emacs-framework.sh
          VERIFY_OPTS: ${{ inputs.pkgs }}
          PKGSRC_URL: http://cdn.netbsd.org/pub/pkgsrc/current/pkgsrc.tar.gz
          BINPKG_SITES: http://cdn.netbsd.org/pub/pkgsrc/packages/NetBSD/${{ matrix.arch }}/11.0
        run: sh .github/ci/run-in-qemu.sh '${{ matrix.image }}'

      - name: 転けたらコンソールを出す
        if: failure()
        run: tail -80 .vm/${{ matrix.image }}.console.log 2>/dev/null || true

  aarch64:
    # Apple Silicon の self-hosted runner で、NetBSD 11.0/aarch64 を HVF に
    # 載せる。GitHub の arm runner には /dev/kvm が無く、x86 の runner では
    # aarch64 は TCG になって 6 時間に収まらない。
    #
    # この workflow は push と workflow_dispatch でしか起きないので、PR の
    # code がこの runner で走ることはない。repo 側も外部の PR は毎回承認が
    # 要る設定にしてある。
    runs-on: [self-hosted, netbsd-aarch64-hvf]
    timeout-minutes: 340
    name: aarch64-11.0 (hvf)
    steps:
      - uses: actions/checkout@v4

      - name: trunk の現物を当て先に敷く
        env:
          GH_TOKEN: ${{ github.token }}
        run: sh .github/ci/fetch-trunk-files.sh emacs-framework

      - name: 枠組みを踏む
        env:
          UPSTREAM_PKG: zakinko/emacs-framework
          VERIFY_SCRIPT: verify-emacs-framework.sh
          VERIFY_OPTS: ${{ inputs.pkgs }}
          PKGSRC_URL: http://cdn.netbsd.org/pub/pkgsrc/current/pkgsrc.tar.gz
          BINPKG_SITES: http://cdn.netbsd.org/pub/pkgsrc/packages/NetBSD/aarch64/11.0
          PORT: '2245'
        run: sh .github/ci/run-in-qemu.sh aarch64-11.0-hvf

      - name: 転けたら serial を出す
        if: failure()
        run: tail -80 .vm/serial.log 2>/dev/null || true

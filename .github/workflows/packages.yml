name: packages

# この repo のパッケージ全部を、mule を回しているのと同じ相手で回す。
#
# mule だけが特別扱いなのは、日本語が編集できるところまで踏まないと通った
# ことにならないからで、自作の三つ (meibo, nss_stns, stnsd) はそこまで要ら
# ない。組めて、入って、PLIST どおりに置かれて、外せる。verify-pkg.sh が
# それを見る。
#
# 三つを一つの job でまとめて回すのは、bootstrap の時間を分け合うため。
# pkgsrc を組むところまでが長いので、そこを三度繰り返す意味がない。一つ
# 転けても残りは走る (build-on-bsd.sh が最後にまとめて落とす)。
#
# 見込み:
#
#   meibo      純 Go。pkgsrc の lang/go を引くので初回は長い。cgo 無しなので
#              OS を選ばないはず。
#   nss_stns   C。OPSYS からモジュール名を決める作りなので、知らない OPSYS で
#              どうなるかがここで出る。
#   stnsd      C。rc.d スクリプトを upstream の .in から生成するので、
#              rc.conf の流儀が違う相手で転ぶかどうか。
#
# autogen と ntp4 は自作ではなく、本家へ出す前の当て物を抱えている。ここで
# 回すのは prefix を決め打ちしていないかを見るためで、PKG_SYSCONFDIR も
# VARBASE も相手によって変わる。NetBSD で通っても他で通るとは限らない。
#
#   autogen    guile22 と libxml2 を引くので初回は長い。mdoc の変換器を
#              探しに行く不具合を直した当て物が入っている。
#   ntp4       設定と鍵の在処を CPPFLAGS で PKG_SYSCONFDIR に向けている。
#              man は SUBST で直すので、そこが相手を選ばないかを見る。

on:
  push:
    paths:
      - 'autogen/**'
      - 'meibo/**'
      - 'nss_stns/**'
      - 'ntp4/**'
      - 'stnsd/**'
      - '.github/workflows/packages.yml'
      - '.github/ci/build-on-bsd.sh'
      - '.github/ci/verify-pkg.sh'
  workflow_dispatch:
    inputs:
      pkgs:
        description: '回すパッケージ (空白区切り)'
        required: false
        default: 'autogen meibo nss_stns ntp4 stnsd'

env:
  PKGS: ${{ inputs.pkgs || 'autogen meibo nss_stns ntp4 stnsd' }}

jobs:
  freebsd:
    name: FreeBSD amd64
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: ディスクを空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgs-freebsd-amd64-${{ github.run_id }}
          restore-keys: pkgs-freebsd-amd64-
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '14.4'
          envs: 'PKGS'
          run: sh .github/ci/build-on-bsd.sh

  openbsd:
    name: OpenBSD amd64
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: ディスクを空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgs-openbsd-amd64-${{ github.run_id }}
          restore-keys: pkgs-openbsd-amd64-
      - uses: vmactions/openbsd-vm@v1
        with:
          release: '7.9'
          envs: 'PKGS'
          run: sh .github/ci/build-on-bsd.sh

  dragonfly:
    name: DragonFly amd64
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: ディスクを空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgs-dragonfly-amd64-${{ github.run_id }}
          restore-keys: pkgs-dragonfly-amd64-
      - uses: vmactions/dragonflybsd-vm@v1
        with:
          release: '6.4.2'
          envs: 'PKGS'
          run: sh .github/ci/build-on-bsd.sh

  midnightbsd:
    name: MidnightBSD amd64
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: ディスクを空ける
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgs-midnightbsd-amd64-${{ github.run_id }}
          restore-keys: pkgs-midnightbsd-amd64-
      - uses: vmactions/midnightbsd-vm@v1
        with:
          release: '4.0.7'
          envs: 'PKGS'
          run: sh .github/ci/build-on-bsd.sh

  linux:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - name: Debian 13
            image: debian:13
            pm: apt
          - name: AlmaLinux 9
            image: almalinux:9
            pm: dnf
    container:
      image: ${{ matrix.image }}
    steps:
      - name: 道具を入れる
        run: |
          set -e
          if [ "${{ matrix.pm }}" = apt ]; then
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends \
              build-essential curl ca-certificates file perl patch \
              tar gzip xz-utils git sudo
          else
            dnf install -y -q gcc gcc-c++ make curl ca-certificates file \
              perl patch tar gzip xz git diffutils findutils which sudo
          fi
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgs-${{ matrix.image }}-${{ github.run_id }}
          restore-keys: pkgs-${{ matrix.image }}-
      - name: 組んで確かめる
        run: sh .github/ci/build-on-bsd.sh

  darwin:
    name: macOS (Darwin)
    runs-on: macos-15
    timeout-minutes: 300
    env:
      PKGSRC_BASE: /opt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgs-darwin-arm64-${{ github.run_id }}
          restore-keys: pkgs-darwin-arm64-
      # Darwin は /usr が書けないので prefix もツリーも /opt 側 (build-on-bsd.sh
      # が OS を見て決める)。stnsd は素の C + curl + openssl で、rc.d の扱いも
      # pkgsrc 任せなので通る見込み。nss_stns は ONLY_FOR_PLATFORM で弾かれる
      # はずで、それは転けたのではなく対象外 -- macOS の名前解決は NSS では
      # なく Open Directory で、モジュールの作りがまるで違う。
      - name: 組んで確かめる
        run: sudo -E env PKGS="$PKGS" sh .github/ci/build-on-bsd.sh
      - name: キャッシュを持ち帰れるようにする
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .bsdcache 2>/dev/null || true

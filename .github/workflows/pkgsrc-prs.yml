name: pkgsrc PRs

# NetBSD/pkgsrc の GitHub PR のうち、実機でしか決着しないものを確かめる。
#
# pkgsrc の正は CVS で、GitHub の NetBSD/pkgsrc は変換ミラーである。
# あちらに出された PR は fork の trunk が作り直されるたび merge-base が
# 腐るので、GitHub 側では原理的に取り込めない。放置されているものが
# 「もう直っているのか」「まだ問題なのか」は、読んでも分からない。
# 建てて見るしかない。
#
#   #173  lua-socket: SunOS does not have sun_len
#         pkgsrc は 2026-02-26 に別の直し方で解消した (PR 60039) ように
#         読めるが、PR が消せと言っている CFLAGS.SunOS の行は今も残って
#         いる。illumos で当て物のありなしを建て分けて決める。
#         中身は .github/ci/verify-lua-socket.sh を読むこと。
#
#   #164  devel/zls: zig 0.13.0 で壊れている
#         PR は 0.13.0 用の当て物だが、pkgsrc の lang/zig はもう 0.16.0 で、
#         zls も 0.16.0 が出ている。package は BROKEN を抱えたままなので
#         公式のバイナリ集合にも zls は無い。版を合わせて BROKEN を外す。
#         当て物は zakinko/zls に置いた。
#
#   #175  security/fail2ban: update to 1.1.0
#         PR は 1.1.0 だがもう 1.1.1 (2026-08-15) が出ている。1.1.0 で
#         Python 2 対応が落ちたので 2to3 の前処理と python 312 固定を外せる。
#         あわせて compat/asyncore.py と compat/asynchat.py が同梱された
#         ので、GitHub issue #174 (asynchat が無い) もこれで閉じる。
#         当て物は zakinko/fail2ban に置いた。
#
#   #153  uim: PLIST fix
#         gtk2 を切ると make package が転ける。素の PLIST が PLIST.gtk2 と
#         PLIST.gtk3 の中身を重ねて持っているためで、切ると組まれていない
#         ものを PLIST が主張する。PR は gtk2 の 9 行しか消していないが、
#         gtk3 の 9 行も同じ状態にある。
#         中身は .github/ci/verify-uim.sh を読むこと。
#
# #173 の相手は OmniOS。投稿者が omnios-r151056 で試したと書いているので
# 既定をそれに合わせた。mule-illumos.yml が r151054 で通っているので、
# 版で転けたらそちらへ落とす。#153 は PLIST の話なので NetBSD で見る。
#
# 組む土台は mule と同じ build-on-bsd.sh を使う。bootstrap から書き直すと
# 必ず片方だけが古くなる。zakinko カテゴリからは何も組まないので PKGS は
# 空にし、上流の package は OVERLAY_PKGS で名指しする。

on:
  push:
    paths:
      - '.github/workflows/pkgsrc-prs.yml'
      - '.github/ci/verify-lua-socket.sh'
      - '.github/ci/verify-uim.sh'
      - '.github/ci/verify-pkg.sh'
      - 'zls/**'
      - 'fail2ban/**'
      # 建てる土台も入れる。ここを直したのに回らず、前の結果を見て
      # 直っていないと思い込みかけた。
      - '.github/ci/run-in-qemu.sh'
      - '.github/ci/build-on-bsd.sh'
  workflow_dispatch:
    inputs:
      release:
        description: 'OmniOS の版'
        required: false
        default: 'r151056'
      uim_options:
        description: 'PKG_OPTIONS.uim (既定は toolkit を全部切る)'
        required: false
        default: '-gtk2 -gtk3 -gtk4 -qt5 -qt6 -xim'

env:
  OMNIOS: ${{ inputs.release || 'r151056' }}
  UIM_OPTIONS: ${{ inputs.uim_options || '-gtk2 -gtk3 -gtk4 -qt5 -qt6 -xim' }}

jobs:
  lua-socket:
    name: net/lua-socket on OmniOS
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: pkgsrc の作りかけを持ち越す
        uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgsrc-omnios-amd64-${{ github.run_id }}
          restore-keys: pkgsrc-omnios-amd64-

      - name: OmniOS で建てて確かめる
        uses: vmactions/omnios-vm@v1
        with:
          release: ${{ env.OMNIOS }}
          # 素の OmniOS にコンパイラは無い。bootstrap がまず転ぶので入れる。
          # gnu-tar も要る。base の tar は pkgsrc.tar.gz の pax 拡張ヘッダを
          # 知らず、ツリーの展開そのものが非零で終わる。
          prepare: |
            pkg install developer/gcc14 developer/build/gnu-make \
                        archiver/gnu-tar || true
          # PKGS='' は「既定に戻せ」ではなく「zakinko からは何も組むな」。
          # build-on-bsd.sh が ${PKGS-mule} で読み分けている。
          run: |
            PKGS='' OVERLAY_PKGS='net/lua-socket' \
              sh .github/ci/build-on-bsd.sh

  uim:
    name: inputmethod/uim on NetBSD
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: ツリーの tarball を持ち越す
        uses: actions/cache@v4
        with:
          path: .vm/*.tar.gz
          key: pkgsrc-tarball-${{ github.run_id }}
          restore-keys: pkgsrc-tarball-

      - name: qemu を入れて KVM を通す
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils netcat-openbsd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          [ -w /dev/kvm ] && echo "KVM あり" || echo "::warning::KVM 無し。相当遅い"

      # vmactions/netbsd-vm ではなく netbsd-ci-images を使う。あちらは
      # GitHub の runner で KVM を使えず TCG になり、uim を回したら 4 時間で
      # 8 パッケージしか組めずに timeout へ当たった。こちらはホストが
      # x86_64 なので amd64 ゲストに KVM が効く。X のセットも入っている。
      - name: NetBSD で建てて確かめる
        env:
          UPSTREAM_PKG: inputmethod/uim
          VERIFY_SCRIPT: verify-uim.sh
          # 公式のバイナリパッケージと版を合わせる。current のままだと依存が
          # 一つも降ってこず、素から組んで 6 時間の上限に当たる。
          PKGSRC_URL: http://cdn.netbsd.org/pub/pkgsrc/pkgsrc-2026Q2/pkgsrc.tar.gz
        run: sh .github/ci/run-in-qemu.sh 'amd64-10.1'

      - name: 転けたらコンソールを出す
        if: failure()
        run: tail -80 .vm/amd64-10.1.console.log 2>/dev/null || true

  fail2ban:
    name: security/fail2ban on NetBSD
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: ツリーの tarball を持ち越す
        uses: actions/cache@v4
        with:
          path: .vm/*.tar.gz
          key: pkgsrc-tarball-${{ github.run_id }}
          restore-keys: pkgsrc-tarball-

      - name: qemu を入れて KVM を通す
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils netcat-openbsd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          [ -w /dev/kvm ] && echo "KVM あり" || echo "::warning::KVM 無し。相当遅い"

      # python と sphinx は四半期のバイナリ集合に在るので bin-install で
      # 降りてくる。PLIST は手で組み立てたものなので、食い違ったら
      # verify-pkg.sh が「並べたのに無い」を並べて出す。
      - name: NetBSD で建てて確かめる
        env:
          UPSTREAM_PKG: zakinko/fail2ban
          VERIFY_SCRIPT: verify-pkg.sh
          PKGSRC_URL: http://cdn.netbsd.org/pub/pkgsrc/pkgsrc-2026Q2/pkgsrc.tar.gz
        run: sh .github/ci/run-in-qemu.sh 'amd64-10.1'

      - name: 転けたらコンソールを出す
        if: failure()
        run: tail -80 .vm/amd64-10.1.console.log 2>/dev/null || true

  zls:
    name: devel/zls on NetBSD
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: ツリーの tarball を持ち越す
        uses: actions/cache@v4
        with:
          path: .vm/*.tar.gz
          key: pkgsrc-tarball-${{ github.run_id }}
          restore-keys: pkgsrc-tarball-

      - name: qemu を入れて KVM を通す
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils netcat-openbsd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          [ -w /dev/kvm ] && echo "KVM あり" || echo "::warning::KVM 無し。相当遅い"

      # zig は 0.16.0 が公式のバイナリ集合に在るので bin-install で降りて
      # くる。LLVM を素から積まずに済む。zls 自身は BROKEN のせいで集合に
      # 無いので、そこだけ組む。
      - name: NetBSD で建てて確かめる
        env:
          UPSTREAM_PKG: zakinko/zls
          VERIFY_SCRIPT: verify-pkg.sh
          PKGSRC_URL: http://cdn.netbsd.org/pub/pkgsrc/pkgsrc-2026Q2/pkgsrc.tar.gz
        run: sh .github/ci/run-in-qemu.sh 'amd64-10.1'

      - name: 転けたらコンソールを出す
        if: failure()
        run: tail -80 .vm/amd64-10.1.console.log 2>/dev/null || true

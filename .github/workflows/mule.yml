name: mule2

# mule2 (Mule 2.3) を NetBSD の各版で組んで、日本語が編集できるところまで
# 確かめる。Mule 1.1 は別物で、そちらを検査するなら mule11.yml を作る。
#
# ファイル名が mule.yml のままなのは、GitHub が workflow の同一性をファイル名で
# 持つため。改名すると UI では別の workflow になり、これまでの実測 (x11 が
# 89 分から 230 分の範囲に散ること) が旧名の側に取り残されて並べて見られなく
# なる。表示名だけ mule2 にして、履歴は繋いでおく。
#
# イメージは netbsd-ci-images の release から取る。runner は x86_64 の
# Linux で KVM が使えるので、i386 と amd64 のゲストはほぼ実速で動く。
#
# 経路が二つある。
#
#   pkgsrc  現行 pkgsrc が通る版。パッケージとして組み、導入まで見る。
#   src     現行 pkgsrc が通らない古い版。配布物にパッチを当てて直に
#           configure/make し、動作だけ見る。パッケージにはならないが、
#           1995 年のこのコードが今のパッチ当てで各版に載るかは分かる。
#
# 境目は経験的なもので、pkgsrc 側が「この版から下は駄目」と宣言している
# わけではない。実際に転けたら src 側へ移す。

on:
  push:
    paths:
      - 'mule2/**'
      - '.github/workflows/mule.yml'
      # .github/ci/** を丸ごと引いていたので、mule と関係ない検査を直した
      # だけで六本が起動していた。あそこには verify-emacs.sh や
      # verify-uim.sh や verify-xwpe.sh が並んでいて、誰かが触るたびに
      # VM を建てる job が積み上がる。account 全体の待ち行列に効く。
      #
      # この workflow が実際に引くのは二つだけ。run-in-qemu.sh を呼び、
      # UPSTREAM_PKG を設定しないので後半の mule2 の道に落ちて
      # verify-mule2.sh に渡る。verify-pkg.sh は UPSTREAM_PKG があるときの
      # 落ち先なので、こちらには関係ない。
      - '.github/ci/run-in-qemu.sh'
      - '.github/ci/verify-mule2.sh'
  pull_request:
    paths:
      - 'mule2/**'
      - '.github/ci/run-in-qemu.sh'
      - '.github/ci/verify-mule2.sh'
  workflow_dispatch:
    inputs:
      images:
        description: '対象イメージ (例 "i386-11.0 amd64-10.1")。空なら既定'
        required: false
      pkgsrc_url:
        description: 'pkgsrc の出どころ。空なら四半期枝 (2026Q2)'
        required: false

  # current は週に一度だけ見る。日常は四半期枝で回すが、上流は動くので
  # 「今の current でも建つ」を放っておくと、気づくのは次に誰かが触った
  # ときになる。土曜の 18:00 UTC (日曜 3:00 JST)。
  schedule:
    - cron: '0 18 * * 6'

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      pkgsrc: ${{ steps.q.outputs.pkgsrc }}
    steps:
      - id: q
        env:
          I: ${{ inputs.images }}
        run: |
          set -e
          [ -n "$I" ] || I="i386-11.0 i386-10.1 i386-9.4 amd64-11.0 amd64-10.1 amd64-9.4"
          printf 'pkgsrc=%s\n' "$(printf '%s\n' $I | jq -Rrn '[inputs] | tostring')" >> $GITHUB_OUTPUT
          cat $GITHUB_OUTPUT

  pkgsrc:
    needs: plan
    runs-on: ubuntu-latest
    # 180 では足りない。current のツリーと release の四半期枝バイナリの
    # 版ずれで依存を建て直す量が決まるので、古い版ほど長くなる。実測で
    # 11.0 の x11 が 126 分、10.1 が 160 分、9.4 と 10.1 の i386 は 180 分に
    # 届かず切られた。CPU を 4 に増やしてもこの傾向は変わらない。
    #
    # GitHub の上限は 360 分。250 分あたりに収まると見て 300 を置く。
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 4
      # 二つの軸を両方 matrix に書く。include に image を持たないものを
      # 並べると、全ての組み合わせにマージされて最後の一つだけが残り、
      # 端末構成が消える。
      matrix:
        image: ${{ fromJSON(needs.plan.outputs.pkgsrc) }}
        config:
          - options: '-canna -wnn4 -x11'
            label: terminal
          - options: 'canna wnn4 x11'
            label: x11
    name: ${{ matrix.image }} ${{ matrix.config.label }}
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: qemu を入れて KVM を通す
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils netcat-openbsd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          [ -w /dev/kvm ] && echo "KVM あり" || echo "::warning::KVM 無し。相当遅い"

      # ftp.m17n.org は消滅していて、残っているのは KAIST の書庫だけ。
      # 落ちていても CI が転ばないよう、取れたものは残す。
      - name: distfile のキャッシュ
        uses: actions/cache@v4
        with:
          path: distfiles
          key: mule-2.3-tarball

      - name: distfile を取る
        run: |
          mkdir -p distfiles
          if [ ! -s distfiles/mule-2.3.tar.gz ]; then
            curl -fsSL -o distfiles/mule-2.3.tar.gz \
              http://ftp.kaist.ac.kr/hangul/mirror/mule/mule-2.3.tar.gz
          fi
          echo "5f6a9047e6c9d752787d6cab3573516c6efd65cd901fbab74d314a5967e6c68b2dc7c2aa7454d8588d421553530c87dd3ee9692d523d818e01739580cb1201fd  distfiles/mule-2.3.tar.gz" \
            | sha512sum -c -

      - name: 組んで確かめる
        # 手で回すときは pkgsrc_url で出どころを差し替えられる。schedule の
        # 回だけは current を見る。日常は run-in-qemu.sh の既定 (四半期枝)。
        env:
          PKGSRC_URL: >-
            ${{ github.event.inputs.pkgsrc_url
                || (github.event_name == 'schedule'
                    && 'http://cdn.netbsd.org/pub/pkgsrc/current/pkgsrc.tar.gz')
                || '' }}
        run: sh .github/ci/run-in-qemu.sh '${{ matrix.image }}' '${{ matrix.config.options }}'

      - name: 転けたらコンソールを出す
        if: failure()
        run: tail -80 .vm/${{ matrix.image }}.console.log 2>/dev/null || true

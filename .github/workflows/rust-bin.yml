name: rust-bin platforms

# lang/rust-bin が ONLY_FOR_PLATFORM で対応を謳う箱のうち、機械を用意
# できるところ全部で建てて動かす。狙いは go-bin.yml と同じ。
#
#   pkgsrc がその箱をどう綴るかを実測し、ONLY_FOR_PLATFORM の当て先を確かめる
#   入った rustc が version を答えるだけでなく、program を建てて走らせる
#
# 謳っているのに機械が無いのは NetBSD の aarch64eb / earmv7hf / earmv6hf /
# powerpc / mipsel / i386 の六つ。vmactions に conf が無く、i386 だけは
# 素の image も無い。zakinko/netbsd-ci-images に作れるかは別途。
#
# SunOS-*-x86_64 は Makefile が対応を謳っているのに配布物の塊が
# コメントアウトされたままだった。上流が illumos の binary を今も出して
# いるのでそこから取るようにし、illumos の二箱で測る。Solaris は illumos
# ではないので、そちらは謳わないことを測る側 (lang-type) で見る。

on:
  push:
    branches: [thttpd, rust-bin]
    paths:
      - '.github/workflows/rust-bin.yml'
      - '.github/ci/verify-rust-bin.sh'
      - '.github/ci/tree-patch-rust-bin-illumos.sh'
      - '.github/ci/tree-rust-bin-illumos.diff'
      - '.github/ci/tree-patch-rust-bin-darwin.sh'
      - '.github/ci/tree-rust-bin-darwin.diff'
  workflow_dispatch:

concurrency:
  group: rust-bin-${{ github.ref }}
  cancel-in-progress: true

env:
  PKGS: ''
  TREE_PKGS: lang/rust-bin
  # bison の nls が gettext-tools と python313 を連れてくる。測っているのは
  # rustc が入って動くかなので外す。go-bin.yml と同じ理由。
  MKCONF_EXTRA: 'PKG_DEFAULT_OPTIONS=-nls'
  TREE_PATCH: '.github/ci/tree-patch-libnbcompat-chflags.sh .github/ci/tree-patch-rust-bin-illumos.sh .github/ci/tree-patch-rust-bin-riscv64-atomic.sh .github/ci/tree-patch-rust-bin-darwin.sh'

jobs:
  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'glibc x86_64',  runner: ubuntu-latest,    image: 'debian:13' }
          - { name: 'glibc aarch64', runner: ubuntu-24.04-arm, image: 'debian:13' }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: 道具
        run: apt-get update -qq && apt-get install -y -qq build-essential curl git tar gzip xz-utils perl bash patch
      - run: PKGSRC_BASE=/tmp sh .github/ci/build-on-bsd.sh

  # Linux-*-i386 も rust-bin が謳っているので測る。ただし container: では
  # 動かない。actions が使う node は x86_64 の binary で、i386 の container の
  # 中で exec できず "exec /__e/node24/bin/node: no such file or directory" に
  # なる (run 35760404446)。node は host 側で走らせ、i386 の userland は
  # docker run の中だけにする。
  #
  # さらに linux32 を噛ませる。--platform linux/386 が替えるのは userland
  # だけで、kernel は x86_64 のままなので uname -m が x86_64 を返す。pkgsrc は
  # それを見て x86_64 として bootstrap し、32bit の compiler と食い違って
  # "C compiler cannot create executables" で止まる (run 35795914872)。
  # linux32 は personality を替えて uname に i686 と答えさせる。
  linux-i386:
    name: Linux glibc i386
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: i386 の userland の中で建てる
        run: |
          docker run --rm --platform linux/386 \
            -v "$PWD:/w" -w /w \
            -e PKGS -e TREE_PKGS -e MKCONF_EXTRA -e TREE_PATCH \
            -e PKGSRC_BASE=/tmp \
            i386/debian:13 sh -c '
              apt-get update -qq &&
              apt-get install -y -qq build-essential curl git tar gzip xz-utils perl bash patch util-linux &&
              exec linux32 sh .github/ci/build-on-bsd.sh'

  bsd:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # 非 x86 の guest は TCG。go-bin.yml で 180 分では足りないことが出ている。
    timeout-minutes: ${{ matrix.arch == '' && 180 || 350 }}
    env:
      # job の timeout は「cancel」なので actions/cache の save が走らない。
      # 実際 FreeBSD aarch64 は 61 package まで建てた所で 350 分に当たり、
      # log には restore の "Cache not found for input keys: gobin-..." は
      # 在るのに "Cache saved: gobin-..." が一度も無い。post step は
      # checkout の分しか走っていなかった。だから毎回ゼロからやり直しで、
      # 何度回しても届かない。
      #
      # script 側が先に降りれば job は「失敗」で終わり、失敗なら post step は
      # 走るので、建てた分が次の run に渡る。350 - 320 = 30 分を copyback と
      # cache の保存に残す。x86 の箱は 180 分で足りているので期限を置かない。
      BUILD_DEADLINE: ${{ matrix.arch == '' && '' || '320m' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'NetBSD amd64',    action: netbsd-vm,  release: '10.1', arch: '' }
          - { name: 'NetBSD aarch64',  action: netbsd-vm,  release: '10.1', arch: 'aarch64' }
          # NetBSD sparc64 は外してある。rust-bin は ONLY_FOR_PLATFORM で
          # 謳っているが、vmactions の image では測れない。conf が
          # VM_DISK_SIZE=4G に固定していて (OpenFirmware の FCode bootblock が
          # 大きな root FFS で "Inode not directory" になる、NetBSD PR 56363)、
          # guest から見える区画は root 1.9G の空き 781M だけ。pkgsrc の木が
          # 1.3GB なので展開の途中で
          #     Can't create '...': No space left on device
          # になる。runner の作業領域も mount されていないので逃がす先が無い。
          # 測るには disk の大きい sparc64 image を別に用意する必要がある。
          - { name: 'NetBSD riscv64',  action: netbsd-vm,  release: '11.0', arch: 'riscv64' }
          - { name: 'FreeBSD amd64',   action: freebsd-vm, release: '14.4', arch: '' }
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: .bsdcache
          key: rustbin-${{ matrix.action }}-${{ matrix.release }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: rustbin-${{ matrix.action }}-${{ matrix.release }}-${{ matrix.arch }}-
      - uses: vmactions/netbsd-vm@v1
        if: matrix.action == 'netbsd-vm'
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          envs: 'PKGS TREE_PKGS MKCONF_EXTRA TREE_PATCH BUILD_DEADLINE'
          run: sh .github/ci/build-on-bsd.sh
      - uses: vmactions/freebsd-vm@v1
        if: matrix.action == 'freebsd-vm'
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          envs: 'PKGS TREE_PKGS MKCONF_EXTRA TREE_PATCH BUILD_DEADLINE'
          run: sh .github/ci/build-on-bsd.sh

  netbsd-i386:
    name: NetBSD i386
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      # vmactions に NetBSD/i386 の image が無い。action の conf にも
      # builder の release の asset にも一つも無く、あちらが持っているのは
      # amd64 と aarch64、riscv64、sparc64、それに 11.0 の microvm だけ
      # (2026-09-23 に両方の repo へ訊いて確認)。自前で建てた image を
      # QEMU で起こす。host が x86_64 なので i386 の guest は KVM で走る。
      #
      # rust-bin は ONLY_FOR_PLATFORM で NetBSD-*-i386 を謳っていて、
      # rpath の塊は Darwin 以外の全部に効くので、ここを測らないと効き目の
      # 範囲を言えない。
      # run-in-qemu.sh は qemu を自分では入れない。mule.yml と同じ手当てを
      # 置く。入れ忘れて一度落ちた: "runvm.sh: qemu-system-i386 が無い"。
      # 既存の workflow に在る step を写さず、新しい job を書き足したときに
      # 抜けた形。
      - name: qemu を入れて KVM を通す
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils netcat-openbsd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo udevadm settle --timeout=10 || true
          [ -w /dev/kvm ] || sudo chmod 666 /dev/kvm 2>/dev/null || true
          # -w だけだと「device が無い」と「在るが書けない」が同じ顔で出る。
          if [ -w /dev/kvm ]; then
            echo "KVM あり"
          elif [ -e /dev/kvm ]; then
            echo "::warning::/dev/kvm は在るが書けない。TCG になり相当遅い"
          else
            echo "::warning::/dev/kvm が無い。TCG になり相当遅い"
          fi
          command -v qemu-system-i386 || { echo "!! qemu-system-i386 が入らなかった"; exit 1; }

      - name: NetBSD/i386 で rust-bin を建てて動かす
        env:
          # 他の箱と同じ木でないと比べられない。run-in-qemu.sh の既定は
          # 四半期枝だが、build-on-bsd.sh は current を引いている。
          PKGSRC_URL: http://cdn.netbsd.org/pub/pkgsrc/current/pkgsrc.tar.gz
          UPSTREAM_PKG: lang/rust-bin
          VERIFY_SCRIPT: verify-rust-bin.sh
        run: sh .github/ci/run-in-qemu.sh i386-11.0

  illumos:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'OmniOS',      action: omnios-vm,      release: 'r151058' }
          - { name: 'OpenIndiana', action: openindiana-vm, release: '' }
          # 当て物は OS_VARIANT が Solaris のときだけ SunOS を
          # ONLY_FOR_PLATFORM から外す。その条件を走らせる箱が無いまま
          # 送る形だったので足す。ここでの正しい結果は「拒まれる」。
          - { name: 'Solaris 11.4', action: solaris-vm,    release: '11.4' }
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: .bsdcache
          key: rustbin-${{ matrix.action }}-${{ github.run_id }}
          restore-keys: rustbin-${{ matrix.action }}-
      - uses: vmactions/omnios-vm@v1
        if: matrix.action == 'omnios-vm'
        with:
          release: ${{ matrix.release }}
          envs: 'PKGS TREE_PKGS MKCONF_EXTRA TREE_PATCH BUILD_DEADLINE'
          prepare: pkg install developer/gcc14 developer/build/gnu-make archiver/gnu-tar web/curl || true
          run: |
            PATH=/opt/gcc-14/bin:$PATH; export PATH
            sh .github/ci/build-on-bsd.sh
      - uses: vmactions/solaris-vm@v1
        if: matrix.action == 'solaris-vm'
        with:
          release: ${{ matrix.release }}
          envs: 'PKGS TREE_PKGS MKCONF_EXTRA TREE_PATCH BUILD_DEADLINE'
          prepare: pkg install --accept developer/gcc developer/build/gnu-make || true
          run: sh .github/ci/build-on-bsd.sh
      - uses: vmactions/openindiana-vm@v1
        if: matrix.action == 'openindiana-vm'
        with:
          envs: 'PKGS TREE_PKGS MKCONF_EXTRA TREE_PATCH BUILD_DEADLINE'
          # 入った rustc が libgcc_s.so.1 を見付けられず起動しなかった
          # (run 35806082502)。箱には在るが /usr/gcc/<版>/lib の下だけで、
          # ld.so の既定の path に無い。OmniOS では同じ rust-bin が動くので、
          # illumos 一般の話ではなく、この箱の置き方の話。
          #
          # どの package が既定の path に置くのかを当てずっぽうで並べず、
          # 箱に訊いて log に残す。答が出たらそれを入れる。
          prepare: |
            pkg install developer/gcc-14 developer/build/gnu-make web/curl || true
            echo "=== libgcc_s.so.1 を提供する package"
            pkg search -H -l -o pkg.name 'path:usr/lib/amd64/libgcc_s.so.1' || true
            pkg search -H -o pkg.name 'path:usr/lib/amd64/libgcc_s.so.1' || true
            echo "=== 既定の path に在るか"
            ls -l /usr/lib/amd64/libgcc_s.so.1 /lib/amd64/libgcc_s.so.1 2>&1 || true
          run: sh .github/ci/build-on-bsd.sh

  darwin:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { arch: aarch64, runner: macos-14 }
          # macos-13 は退役した。actions/runner-images #13046 が「9/22 に
          # 非推奨、12/4 で完全に非対応」と告知したとおりで、指しても job は
          # 起動せず queued のまま残る (20 時間待って一度も start しなかった)。
          # Intel の後継は macos-15-intel (同 #13045)。
          - { arch: x86_64,  runner: macos-15-intel }
    steps:
      - uses: actions/checkout@v4
      # 二つ渡す必要がある。/ が読み取り専用なので /pkgsrc-ci が掘れず
      # (mkdir: /pkgsrc-ci: Read-only file system)、書ける所を PKGSRC_BASE で
      # 渡す。そして build-on-bsd.sh は「呼ぶ側が sudo を渡す」作りで、
      # Linux の container は root で走るから素で通るが、macOS の runner は
      # runner 権限なので bootstrap が
      #   You must be either root to install bootstrap-pkgsrc
      # で止まる。-E で PKGS などの環境を保つ。
      - run: sudo -E env PKGSRC_BASE="$RUNNER_TEMP" sh .github/ci/build-on-bsd.sh

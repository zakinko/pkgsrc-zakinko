name: mule (other OS)

# BSD 以外の pkgsrc プラットフォームでも mule を組んでみる。
#
# pkgsrc が mk/platform/ に持っているのは AIX Cygwin Darwin DragonFly
# FreeBSD FreeMiNT HPUX Haiku IRIX Linux MidnightBSD Minix NetBSD OSF1
# OpenBSD QNX SCO_SV SunOS UnixWare の 19 で、このうち機械が手に入って
# 走らせられるものをここに集める。BSD 系は mule-otherbsd.yml のほう。
#
# ここの二つは VM が要らない。GitHub の runner がそのまま Darwin であり
# Linux であるので、pkgsrc を bootstrap して組むだけでよい。ただし runner
# は root ではないので、sudo と、ツリーの置き場所を呼ぶ側から渡す。
#
# 見込み:
#
#   Darwin   s/darwin.h に相当するものが 1995 年の tree に無い。configure が
#            unported で止まるはず。仮に通っても、Mach-O では unexec が
#            成り立たない (Emacs が unexmacosx.c を持つのは 21 以降)。
#   Linux    s/linux.h は当時からある。glibc も gcc も当時とは別物なので
#            そのままは通らないだろうが、止まる場所は configure より先に
#            なるはずで、BSD 勢とは違う景色が見える。
#   FreeMiNT Atari の m68k。ARAnyM という仮想機械があるので、機械が手に
#            入らない側 (AIX, HP-UX, IRIX, Tru64, SCO, UnixWare, QNX) の
#            中で唯一ここだけ回せる。ただし使えるイメージ (AFROS) には
#            コンパイラが入っていないので、まずは中に何があるかを見る。
#
# どちらも「駄目でした」で終わらせず、どこで止まったかを残すのが目的。

on:
  push:
    paths:
      - 'mule2/**'
      - '.github/workflows/mule-otheros.yml'
      - '.github/ci/**'
      - 'libuuid/**'
  pull_request:
    paths:
      - 'mule2/**'
      - '.github/ci/**'
      - 'libuuid/**'
  workflow_dispatch:
    inputs:
      options:
        description: 'PKG_OPTIONS.mule2 (既定は端末のみ)'
        required: false
        default: '-canna -wnn4 -x11'

env:
  OPTIONS: ${{ inputs.options || '-canna -wnn4 -x11' }}
  # native runner にはツリーを置く区画を選ばせない。一つしかないし、
  # df の桁も BSD と違う。
  PKGSRC_BASE: /opt

jobs:
  darwin:
    name: macOS (Darwin)
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: distfile のキャッシュ
        uses: actions/cache@v4
        with:
          path: distfiles
          key: mule-2.3-tarball

      - name: distfile を取る
        run: sh .github/ci/fetch-distfile.sh

      - name: pkgsrc の作りかけを持ち越す
        uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgsrc-darwin-arm64-${{ github.run_id }}
          restore-keys: pkgsrc-darwin-arm64-

      # Darwin は /usr が SIP で書けないので、prefix もツリーも /opt 側に
      # 寄る (build-on-bsd.sh が OS を見て決める)。検査のほうは
      # verify-mule.sh もそれを受け取るようになったので、日本語が編集できる
      # ところまでの full の検査を通す。
      - name: 組んで確かめる
        run: sudo -E sh .github/ci/build-on-bsd.sh "$OPTIONS"

      # root で組んだものをそのままにすると、キャッシュを保存する側が
      # 読めない。
      - name: キャッシュを持ち帰れるようにする
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .bsdcache 2>/dev/null || true

  linux:
    name: Linux (glibc)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: ディスクを空ける
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
          df -h /

      - name: distfile のキャッシュ
        uses: actions/cache@v4
        with:
          path: distfiles
          key: mule-2.3-tarball

      - name: distfile を取る
        run: sh .github/ci/fetch-distfile.sh

      - name: pkgsrc の作りかけを持ち越す
        uses: actions/cache@v4
        with:
          path: .bsdcache
          key: pkgsrc-linux-amd64-${{ github.run_id }}
          restore-keys: pkgsrc-linux-amd64-

      - name: 組んで確かめる
        run: sudo -E sh .github/ci/build-on-bsd.sh "$OPTIONS"

      - name: キャッシュを持ち帰れるようにする
        if: always()
        run: sudo chown -R "$(id -u):$(id -g)" .bsdcache 2>/dev/null || true

  freemint:
    name: FreeMiNT (ARAnyM)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: ARAnyM を入れる
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq aranym unzip
          command -v aranym-jit || command -v aranym

      # 8.7MB。SourceForge は落ちていることがあるので取れたら残す。
      - name: AFROS のキャッシュ
        uses: actions/cache@v4
        with:
          path: .freemint/afros812.zip
          key: afros-8.12

      - name: 起動して中を見る
        run: sh .github/ci/run-freemint.sh

      - name: 転けたら ARAnyM の言い分を出す
        if: failure()
        run: tail -40 .freemint/aranym.log 2>/dev/null || true

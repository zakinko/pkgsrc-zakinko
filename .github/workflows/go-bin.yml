name: go-bin platforms

# zakinko/go-bin を、上流が binary を出している platform のうち箱を用意
# できるところ全部で建てて動かす。狙いは二つ。
#   pkgsrc がその箱をどう綴るかを実測し、ONLY_FOR_PLATFORM の当て先を確かめる
#   入った go が version を答えるだけでなく、実際に program を建てて走らせる
#
# 公開 repo なので標準 runner は無制限。vmactions は重いのでこの branch の
# push に限る。

on:
  push:
    branches: [thttpd, go-bin]
    paths: [go-bin/**, .github/workflows/go-bin.yml, .github/ci/verify-go-bin.sh, .github/ci/build-on-bsd.sh]
  workflow_dispatch:

concurrency:
  group: go-bin-${{ github.ref }}
  cancel-in-progress: true

env:
  PKGS: go-bin
  # bash -> bison -> gettext-tools(nls) -> python313 と繋がる。TCG の箱では
  # この連鎖だけで二時間以上かかり、FreeBSD aarch64 と OpenBSD aarch64/riscv64
  # が 180 分の timeout に当たっていた (run 35687631661)。測っているのは
  # go の binary が入って動くかで、nls はそこに関わらないので外す。
  MKCONF_EXTRA: 'PKG_DEFAULT_OPTIONS=-nls'
  # 木の直し二つ。OpenBSD の側は devel/ncurses の configure が ld.so.hints を
  # 潰すのを止めるもので、pkgsrc-prs-platforms.yml が既に使っている。
  # libnbcompat の側は Solaris 11.4 の bootstrap が lchflags.c で落ちるもの。
  # どちらも当たらない箱では何も起きない。
  # Solaris 11.4 の bootstrap が libnbcompat の lchflags.c で落ちる。
  # chflags(2) の有無を OS の名前で決めていて Solaris がその列に無いため。
  # 当たらない箱では何も起きないので全箱に配る。
  TREE_PATCH: .github/ci/tree-patch-libnbcompat-chflags.sh

jobs:
  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'glibc x86_64',  runner: ubuntu-latest,    image: 'debian:13' }
          - { name: 'glibc aarch64', runner: ubuntu-24.04-arm, image: 'debian:13' }
          - { name: 'musl x86_64',   runner: ubuntu-latest,    image: 'alpine:latest' }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: 道具
        run: |
          if command -v apk >/dev/null; then
            apk add --no-cache build-base curl git tar gzip perl bash coreutils procps patch gawk
          else
            apt-get update -qq && apt-get install -y -qq build-essential curl git tar gzip perl bash patch
          fi
      - run: PKGSRC_BASE=/tmp sh .github/ci/build-on-bsd.sh

  # host と違う arch の Linux。go-bin は ONLY_FOR_PLATFORM にこれらを並べる
  # ので、並べるだけで一度も動かさないのは「動きます」と言って測っていない
  # ことになる。qemu-user で回す。全 system の TCG とは違い、userland だけを
  # 翻訳するので pkgsrc の bootstrap でも現実的な時間で終わる。
  #
  # image の在処は先に数えた。debian の公式 arch 名前空間に
  #   riscv64 ppc64le s390x      13 が在る
  #   mips64le                   13 は無く bookworm (12) が在る
  #   loongarch64                latest が在る
  #   mipsel mips mips64 ppc64   無い (Debian が落とした arch)
  # 最後の四つは Go がまだ binary を出しているのに箱が無い。別に扱う。
  linux-foreign:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'glibc riscv64',     platform: 'linux/riscv64',     image: 'riscv64/debian:13' }
          - { name: 'glibc ppc64le',     platform: 'linux/ppc64le',     image: 'ppc64le/debian:13' }
          - { name: 'glibc s390x',       platform: 'linux/s390x',       image: 's390x/debian:13' }
          - { name: 'glibc mips64le',    platform: 'linux/mips64le',    image: 'mips64le/debian:bookworm' }
          - { name: 'glibc loongarch64', platform: 'linux/loong64',     image: 'loongarch64/debian:latest' }
    steps:
      - uses: actions/checkout@v4
      # binfmt の登録。これが無いと foreign の image は exec format error。
      - uses: docker/setup-qemu-action@v3
      - name: arch を確かめる
        run: |
          got=$(docker run --rm --platform ${{ matrix.platform }} ${{ matrix.image }} uname -m)
          echo "uname -m: $got"
          # 翻訳が効いていないと host の x86_64 が返る。それを緑にしない。
          [ "$got" != "x86_64" ] || { echo "!! host の arch が返っている。qemu が効いていない"; exit 1; }
      - name: 建てて動かす
        env:
          BUILD_DEADLINE: 270m
        run: |
          docker run --rm --platform ${{ matrix.platform }} \
            -v "$PWD:/w" -w /w \
            -e PKGS -e TREE_PKGS -e MKCONF_EXTRA -e TREE_PATCH -e BUILD_DEADLINE \
            -e PKGSRC_BASE=/tmp \
            ${{ matrix.image }} sh -c '
              apt-get update -qq &&
              apt-get install -y -qq build-essential curl git tar gzip xz-utils perl bash patch util-linux &&
              exec sh .github/ci/build-on-bsd.sh'

  # NetBSD/i386。vmactions は NetBSD の image を amd64 / aarch64 / riscv64 /
  # sparc64 と 11.0 の microvm しか持たないので、自前で建てた image を QEMU で
  # 起こす。host が x86_64 なので i386 の guest は KVM で走る。
  netbsd-i386:
    name: NetBSD i386
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - name: qemu を入れて KVM を通す
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq qemu-system-x86 qemu-utils netcat-openbsd
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules > /dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm || true
          sudo udevadm settle --timeout=10 || true
          [ -w /dev/kvm ] || sudo chmod 666 /dev/kvm 2>/dev/null || true
          if [ -w /dev/kvm ]; then echo "KVM あり"
          elif [ -e /dev/kvm ]; then echo "::warning::/dev/kvm は在るが書けない。TCG になり相当遅い"
          else echo "::warning::/dev/kvm が無い。TCG になり相当遅い"; fi
          command -v qemu-system-i386 || { echo "!! qemu-system-i386 が入らなかった"; exit 1; }
      - name: NetBSD/i386 で go-bin を建てて動かす
        env:
          # 他の箱と同じ木でないと比べられない。run-in-qemu.sh の既定は
          # 四半期枝だが、build-on-bsd.sh は current を引いている。
          PKGSRC_URL: http://cdn.netbsd.org/pub/pkgsrc/current/pkgsrc.tar.gz
          UPSTREAM_PKG: zakinko/go-bin
          VERIFY_SCRIPT: verify-go-bin.sh
        run: sh .github/ci/run-in-qemu.sh i386-11.0

  bsd:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    # 非 x86 の guest は TCG なので、同じ仕事が三倍以上かかる。x86 は 180 分
    # で足りている (NetBSD amd64 が 24 分、FreeBSD amd64 が 51 分)。
    timeout-minutes: ${{ matrix.arch == '' && 180 || 350 }}
    env:
      # job の timeout は「cancel」なので actions/cache の save が走らない。
      # 実際 FreeBSD aarch64 は 61 package まで建てた所で 350 分に当たり、
      # log には restore の "Cache not found for input keys: gobin-..." は
      # 在るのに "Cache saved: gobin-..." が一度も無い。post step は
      # checkout の分しか走っていなかった。だから毎回ゼロからやり直しで、
      # 何度回しても届かない。
      #
      # script 側が先に降りれば job は「失敗」で終わり、失敗なら post step は
      # 走るので、建てた分が次の run に渡る。350 - 320 = 30 分を copyback と
      # cache の保存に残す。x86 の箱は 180 分で足りているので期限を置かない。
      BUILD_DEADLINE: ${{ matrix.arch == '' && '' || '320m' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'NetBSD amd64',    action: netbsd-vm,       release: '10.1',    arch: '' }
          - { name: 'NetBSD aarch64',  action: netbsd-vm,       release: '10.1',    arch: 'aarch64' }
          - { name: 'FreeBSD amd64',   action: freebsd-vm,      release: '14.4',    arch: '' }
          - { name: 'FreeBSD aarch64', action: freebsd-vm,      release: '14.4',    arch: 'aarch64' }
          - { name: 'OpenBSD amd64',   action: openbsd-vm,      release: '7.9',     arch: '' }
          - { name: 'OpenBSD aarch64', action: openbsd-vm,      release: '7.9',     arch: 'aarch64' }
          - { name: 'OpenBSD riscv64', action: openbsd-vm,      release: '7.9',     arch: 'riscv64' }
          - { name: 'DragonFly amd64', action: dragonflybsd-vm, release: '',        arch: '' }
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: .bsdcache
          key: gobin-${{ matrix.action }}-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: gobin-${{ matrix.action }}-${{ matrix.arch }}-
      - uses: vmactions/netbsd-vm@v1
        if: matrix.action == 'netbsd-vm'
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          envs: 'PKGS MKCONF_EXTRA TREE_PATCH BUILD_DEADLINE'
          run: sh .github/ci/build-on-bsd.sh
      - uses: vmactions/freebsd-vm@v1
        if: matrix.action == 'freebsd-vm'
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          envs: 'PKGS MKCONF_EXTRA TREE_PATCH BUILD_DEADLINE'
          run: sh .github/ci/build-on-bsd.sh
      # devel/ncurses の configure が `ldconfig -v` を走らせ、OpenBSD では
      # それが /var/run/ld.so.hints を /usr/lib だけで書き直す。/usr/local の
      # binary が全部 library を見失い、建ちが通ったのに copyback の rsync が
      # 落ちて job が赤くなっていた。送る diff そのものをここで当てるので、
      # 報告に貼るものと CI が測るものが同じ一つになる。
      - uses: vmactions/openbsd-vm@v1
        if: matrix.action == 'openbsd-vm'
        # ncurses の当て物はこの箱でしか要らない。openbsd-all は go-bin と
        # openssl の当て物も連れてくるので、他の箱には配らない。
        env:
          TREE_PATCH: '.github/ci/tree-patch-libnbcompat-chflags.sh .github/ci/tree-patch-openbsd-all.sh'
        with:
          release: ${{ matrix.release }}
          arch: ${{ matrix.arch }}
          envs: 'PKGS MKCONF_EXTRA TREE_PATCH BUILD_DEADLINE'
          run: sh .github/ci/build-on-bsd.sh
      - uses: vmactions/dragonflybsd-vm@v1
        if: matrix.action == 'dragonflybsd-vm'
        with:
          envs: 'PKGS MKCONF_EXTRA TREE_PATCH BUILD_DEADLINE'
          prepare: pkg install -y curl
          run: sh .github/ci/build-on-bsd.sh

  illumos:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'OmniOS',      action: omnios-vm,      release: 'r151058' }
          - { name: 'OpenIndiana', action: openindiana-vm, release: '' }
          - { name: 'Solaris 11.4', action: solaris-vm,    release: '11.4' }
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: .bsdcache
          key: gobin-${{ matrix.action }}-${{ github.run_id }}
          restore-keys: gobin-${{ matrix.action }}-
      - uses: vmactions/omnios-vm@v1
        if: matrix.action == 'omnios-vm'
        with:
          release: ${{ matrix.release }}
          envs: 'PKGS MKCONF_EXTRA TREE_PATCH BUILD_DEADLINE'
          prepare: pkg install developer/gcc14 developer/build/gnu-make archiver/gnu-tar web/curl || true
          run: |
            PATH=/opt/gcc-14/bin:$PATH; export PATH
            sh .github/ci/build-on-bsd.sh
      # OpenIndiana と Solaris の素の image には cc が無く、bootstrap の
      # bmake の configure が "no acceptable C compiler found in $PATH" で
      # 止まる。入れた gcc が /usr/bin に現れるかは mediator 次第なので、
      # /usr/gcc/<版>/bin を拾うのは build-on-bsd.sh にやらせる。
      - uses: vmactions/openindiana-vm@v1
        if: matrix.action == 'openindiana-vm'
        with:
          envs: 'PKGS MKCONF_EXTRA TREE_PATCH BUILD_DEADLINE'
          prepare: pkg install developer/gcc-14 developer/build/gnu-make web/curl || true
          run: sh .github/ci/build-on-bsd.sh
      - uses: vmactions/solaris-vm@v1
        if: matrix.action == 'solaris-vm'
        with:
          release: ${{ matrix.release }}
          envs: 'PKGS MKCONF_EXTRA TREE_PATCH BUILD_DEADLINE'
          prepare: pkg install --accept developer/gcc developer/build/gnu-make || true
          run: sh .github/ci/build-on-bsd.sh

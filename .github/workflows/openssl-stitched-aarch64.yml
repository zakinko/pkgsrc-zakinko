# OpenSSL の stitched AES-SHA1 (aarch64 の手書き asm) が OpenBSD/arm64 で
# SIGSEGV する。同じ asm を同じ perlasm scheme (linux64) で使う Linux/arm64 で
# 撃って、OpenBSD 固有かどうかを決める。
#
#   OpenBSD 7.9/arm64   落ちる (asm_aescbc_sha1_hmac、x8 が不正)
#   macOS 26/arm64      通る (ただし scheme は ios64 なので生成物が違う)
#   Linux/arm64         ここで測る
#
# 手で起動する。一度きりの切り分けなので schedule も push も付けない。

name: openssl stitched AES-SHA1 on aarch64

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-arm64:
    name: openssl 3.6.4 の stitched 試験 (Linux/arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - name: 建てて撃つ
        run: |
          set -e
          curl -fsSL -o openssl.tar.gz \
            https://github.com/openssl/openssl/releases/download/openssl-3.6.4/openssl-3.6.4.tar.gz
          tar xzf openssl.tar.gz
          cd openssl-3.6.4
          ./Configure 2>&1 | grep -i 'for target'
          test -f crypto/aes/asm/aes-sha1-armv8.pl && echo "stitched の asm は木に在る"
          make -j"$(nproc)" > build.log 2>&1 || { tail -20 build.log; exit 1; }
          ls -la crypto/aes/aes-sha1-armv8.S | awk '{print "  生成された asm:", $5, "byte"}'
          echo "=== 落ちる試験を直に ==="
          ./util/wrap.pl ./test/evp_test -config ./test/default-and-legacy.cnf \
            ./test/recipes/30-test_evp_data/evpciph_aes_stitched.txt 2>&1 | tail -8
          echo "=== 同じ二つの試験 ==="
          make test TESTS='test_evp test_evp_libctx' 2>&1 | tail -8

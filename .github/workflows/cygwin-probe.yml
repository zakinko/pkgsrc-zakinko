name: cygwin probe

# Cygwin で pkgsrc の bootstrap がどこまで行くかを測るだけ。
#
# go-bin の platform.mk に windows の archive を入れるかを「pkgsrc は Windows で
# 走らない」で決めようとしていた。それは誤りだった。mk/platform/Cygwin.mk は
# 在り、bootstrap にも CYGWIN_*) が在って opsys=`uname -o` を取る。在ることと
# 通ることは別なので、実機で測る。
#
# windows は macOS より高い (2 倍) が、これは一度だけの偵察で、通れば
# platform.mk の表が三行増える。回し続ける物ではない。

on:
  push:
    branches: [thttpd]
    paths: ['.github/ci/probe-cygwin.sh']
  workflow_dispatch:

concurrency:
  group: cygwin-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 60
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: cygwin/cygwin-install-action@v5
        with:
          packages: >-
            gcc-core gcc-g++ make curl wget tar gzip xz patch
            diffutils findutils gawk sed grep libiconv-devel
            zlib-devel openssl-devel perl git
      - name: 偵察
        shell: C:\cygwin\bin\bash.exe --login --norc -eo pipefail -o igncr {0}
        run: |
          cd "$(cygpath -u '${{ github.workspace }}')"
          sh .github/ci/probe-cygwin.sh

name: thttpd CVE patch

# zakinko/thttpd を pkgsrc を bootstrap して建て、三つの CVE を回せる箱すべてで
# 撃つ。各箱で build-on-bsd.sh が pkgsrc を bootstrap → zakinko/thttpd を建てて
# verify-thttpd.sh を呼ぶ。verify-thttpd.sh の中身:
#   pkgsrc で建って入る
#   CVE-2009-4491 (log injection)  どの箱でも。上流に修正が無いので手厚く
#   CVE-2012-5640 (crypt NULL)     NULL を返す箱は native、返さない箱は shim
#   CVE-2007-0158 (underflow)      空 symlink + ASan が動く箱で full process を撃つ
#
# 公開 repo なので標準 runner は無制限。vmactions は重いので push は
# この branch に限る。

on:
  push:
    branches: [thttpd]
    paths: [thttpd/**, .github/workflows/thttpd-cve.yml, .github/ci/verify-thttpd.sh, .github/ci/build-on-bsd.sh]
  workflow_dispatch:

concurrency:
  group: thttpd-cve-${{ github.ref }}
  cancel-in-progress: true

env:
  PKGS: thttpd

jobs:
  linux:
    name: Linux ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'glibc x86_64',  runner: ubuntu-latest,    image: 'debian:13' }
          - { name: 'glibc aarch64', runner: ubuntu-24.04-arm, image: 'debian:13' }
          - { name: 'musl x86_64',   runner: ubuntu-latest,    image: 'alpine:latest' }
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - name: 道具
        run: |
          if command -v apk >/dev/null; then
            apk add --no-cache build-base curl git tar gzip perl bash coreutils procps patch gawk
          else
            apt-get update -qq && apt-get install -y -qq build-essential curl git tar gzip perl bash patch
          fi
      - name: build+verify
        run: PKGSRC_BASE=/tmp sh .github/ci/build-on-bsd.sh

  freebsd:
    name: FreeBSD ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          # aarch64 は TCG で、pkgsrc の bootstrap だけで二時間を超える。
          # 六時間の上限に収まらないので回さない。
          - { arch: x86_64,  vmarch: '' }
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: .bsdcache
          key: thttpd-freebsd-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: thttpd-freebsd-${{ matrix.arch }}-
      - uses: vmactions/freebsd-vm@v1
        with:
          release: '14.4'
          arch: ${{ matrix.vmarch }}
          envs: 'PKGS'
          run: sh .github/ci/build-on-bsd.sh

  openbsd:
    name: OpenBSD
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: .bsdcache
          key: thttpd-openbsd-${{ github.run_id }}
          restore-keys: thttpd-openbsd-
      - uses: vmactions/openbsd-vm@v1
        with:
          release: '7.9'
          envs: 'PKGS'
          run: sh .github/ci/build-on-bsd.sh

  netbsd:
    name: NetBSD
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: .bsdcache
          key: thttpd-netbsd-${{ github.run_id }}
          restore-keys: thttpd-netbsd-
      - uses: vmactions/netbsd-vm@v1
        with:
          release: '10.1'
          envs: 'PKGS'
          run: sh .github/ci/build-on-bsd.sh

  illumos:
    name: illumos (OmniOS)
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: .bsdcache
          key: thttpd-illumos-${{ github.run_id }}
          restore-keys: thttpd-illumos-
      - uses: vmactions/omnios-vm@v1
        with:
          release: 'r151058'
          envs: 'PKGS'
          # gcc14 も gcc13 も libsanitizer を無効にして建てられていて、
          # どちらも -fsanitize=address を断る。入れても無駄なので戻した。
          prepare: pkg install developer/gcc14 developer/build/gnu-make archiver/gnu-tar web/curl || true
          run: |
            PATH=/opt/gcc-14/bin:$PATH; export PATH
            sh .github/ci/build-on-bsd.sh

  dragonfly:
    name: DragonFly
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc || true
      - uses: actions/cache@v4
        with:
          path: .bsdcache
          key: thttpd-dfly-${{ github.run_id }}
          restore-keys: thttpd-dfly-
      - uses: vmactions/dragonflybsd-vm@v1
        with:
          envs: 'PKGS'
          # base の gcc も dports の gcc14 も libasan を持たない
          # (cannot find -lasan)。入れても無駄なので戻した。
          prepare: pkg install -y curl
          run: sh .github/ci/build-on-bsd.sh
